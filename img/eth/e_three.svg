<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" width="720" height="656">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="326" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">무엇을 보고 옳고 그름을 판단할까?</text><rect x="12" y="52" width="76" height="56" rx="10" fill="#deede1" stroke="#5aa469" stroke-width="1.6"/><text x="50" y="77" text-anchor="middle" class="b">행위자</text><text x="50" y="95" text-anchor="middle" class="xs" style="fill:#6b6252">(품성)</text><line x1="89" y1="80" x2="95.0" y2="80.0" stroke="#5a5246" stroke-width="1.4"/><polygon points="98,80 91.7,83.0 91.7,77.0" fill="#5a5246"/><rect x="98" y="52" width="76" height="56" rx="10" fill="#dce7f4" stroke="#4f86c6" stroke-width="1.6"/><text x="136" y="77" text-anchor="middle" class="b">동기</text><text x="136" y="95" text-anchor="middle" class="xs" style="fill:#6b6252">(의무·선의지)</text><line x1="175" y1="80" x2="181.0" y2="80.0" stroke="#5a5246" stroke-width="1.4"/><polygon points="184,80 177.7,83.0 177.7,77.0" fill="#5a5246"/><rect x="184" y="52" width="76" height="56" rx="10" fill="#f4f1ea" stroke="#8a8274" stroke-width="1.6"/><text x="222" y="77" text-anchor="middle" class="b">행위</text><line x1="261" y1="80" x2="267.0" y2="80.0" stroke="#5a5246" stroke-width="1.4"/><polygon points="270,80 263.7,83.0 263.7,77.0" fill="#5a5246"/><rect x="270" y="52" width="76" height="56" rx="10" fill="#f9ebd8" stroke="#e39b3a" stroke-width="1.6"/><text x="308" y="77" text-anchor="middle" class="b">결과</text><text x="308" y="95" text-anchor="middle" class="xs" style="fill:#6b6252">(쾌락·행복)</text><rect x="14" y="128" width="332" height="50" rx="10" fill="#fff" stroke="#9cc8a5" stroke-width="1.3"/><rect x="22" y="140" width="74" height="26" rx="13.0" fill="#5aa469"/><text x="59.0" y="157.5" text-anchor="middle" class="s b" style="fill:#fff">덕 윤리</text><text x="106" y="150" text-anchor="start" class="s b">“어떤 사람이 되어야 하는가?”</text><text x="106" y="168" text-anchor="start" class="xs" style="fill:#7a7264">아리스토텔레스 · 매킨타이어</text><rect x="14" y="186" width="332" height="50" rx="10" fill="#fff" stroke="#95b6dd" stroke-width="1.3"/><rect x="22" y="198" width="74" height="26" rx="13.0" fill="#4f86c6"/><text x="59.0" y="215.5" text-anchor="middle" class="s b" style="fill:#fff">의무론</text><text x="106" y="208" text-anchor="start" class="s b">“마땅히 해야 할 의무인가?”</text><text x="106" y="226" text-anchor="start" class="xs" style="fill:#7a7264">아퀴나스(자연법) · 칸트</text><rect x="14" y="244" width="332" height="50" rx="10" fill="#fff" stroke="#eec389" stroke-width="1.3"/><rect x="22" y="256" width="74" height="26" rx="13.0" fill="#e39b3a"/><text x="59.0" y="273.5" text-anchor="middle" class="s b" style="fill:#fff">공리주의</text><text x="106" y="266" text-anchor="start" class="s b">“얼마나 큰 행복을 낳는가?”</text><text x="106" y="284" text-anchor="start" class="xs" style="fill:#7a7264">벤담 · 밀</text><text x="180" y="312" text-anchor="middle" class="s" style="fill:#6b6252">도덕 과학적 접근: 도덕성의 기원을 진화·뇌로 설명</text></svg>