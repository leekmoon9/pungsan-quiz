<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" width="720" height="524">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="260" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">롤스가 말한 절차적 정의의 세 유형</text><rect x="14" y="46" width="332" height="62" rx="10" fill="#fff" stroke="#9cc8a5" stroke-width="1.3"/><rect x="24" y="64" width="80" height="26" rx="13.0" fill="#5aa469"/><text x="64.0" y="81.5" text-anchor="middle" class="s b" style="fill:#fff">완전한</text><text x="116" y="70" text-anchor="start" class="s b">기준 ○ · 절차 ○</text><text x="116" y="90" text-anchor="start" class="xs" style="fill:#6b6252">예) 케이크 자르기 — 자르는 사람이 마지막 조각</text><rect x="14" y="116" width="332" height="62" rx="10" fill="#fff" stroke="#eec389" stroke-width="1.3"/><rect x="24" y="134" width="80" height="26" rx="13.0" fill="#e39b3a"/><text x="64.0" y="151.5" text-anchor="middle" class="s b" style="fill:#fff">불완전한</text><text x="116" y="140" text-anchor="start" class="s b">기준 ○ · 절차 불완전</text><text x="116" y="160" text-anchor="start" class="xs" style="fill:#6b6252">예) 형사 재판 — 무고한 사람이 처벌될 수도</text><rect x="14" y="186" width="332" height="62" rx="10" fill="#fff" stroke="#95b6dd" stroke-width="1.3"/><rect x="24" y="204" width="80" height="26" rx="13.0" fill="#4f86c6"/><text x="64.0" y="221.5" text-anchor="middle" class="s b" style="fill:#fff">순수</text><text x="116" y="210" text-anchor="start" class="s b">기준 ✕ · 공정한 절차 ○</text><text x="116" y="230" text-anchor="start" class="xs" style="fill:#6b6252">예) 게임(도박) — 공정한 규칙 → 결과도 공정</text></svg>