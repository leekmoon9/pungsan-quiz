<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" width="720" height="628">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="312" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">칸트: 같은 봉사, 다른 동기</text><rect x="14" y="46" width="160" height="156" rx="12" fill="#fff" stroke="#b9b4ac" stroke-width="1.3"/><circle cx="44" cy="74" r="7" fill="#8a8274" stroke="none" stroke-width="1.3"/><path d="M34,100 q0,-16 10,-16 q10,0 10,16z" fill="#8a8274"/><text x="44" y="118" text-anchor="middle" class="s b">학생 A</text><path d="M66,60 h96 a8,8 0 0 1 8,8 v22 a8,8 0 0 1 -8,8 h-90 l-8,8 v-8 a6,6 0 0 1 -6,-6 v-24 a8,8 0 0 1 8,-8z" fill="#efeeec"/><text x="116" y="83" text-anchor="middle" class="xs b">“칭찬받겠지?”</text><text x="94" y="148" text-anchor="middle" class="s">의무에 맞는 행위</text><rect x="36" y="160" width="116" height="28" rx="14.0" fill="#b9b0a0"/><text x="94.0" y="178.5" text-anchor="middle" class="s b" style="fill:#fff">도덕적 가치 ✕</text><rect x="186" y="46" width="160" height="156" rx="12" fill="#fff" stroke="#95b6dd" stroke-width="1.3"/><circle cx="216" cy="74" r="7" fill="#4f86c6" stroke="none" stroke-width="1.3"/><path d="M206,100 q0,-16 10,-16 q10,0 10,16z" fill="#4f86c6"/><text x="216" y="118" text-anchor="middle" class="s b">학생 B</text><path d="M238,60 h96 a8,8 0 0 1 8,8 v22 a8,8 0 0 1 -8,8 h-90 l-8,8 v-8 a6,6 0 0 1 -6,-6 v-24 a8,8 0 0 1 8,-8z" fill="#e6eef7"/><text x="288" y="77" text-anchor="middle" class="xs b">“마땅히 해야 할</text><text x="288" y="90" text-anchor="middle" class="xs b">일이니까”</text><text x="266" y="148" text-anchor="middle" class="s">의무에서 나온 행위(선의지)</text><rect x="208" y="160" width="116" height="28" rx="14.0" fill="#4f86c6"/><text x="266.0" y="178.5" text-anchor="middle" class="s b" style="fill:#fff">도덕적 가치 ○</text><text x="180" y="222" text-anchor="middle" class="b">행위의 도덕성 = 결과가 아니라 동기(선의지)</text><rect x="14" y="236" width="160" height="64" rx="10" fill="#eaf0f8" stroke="#a7c2e2" stroke-width="1.3"/><text x="94" y="256" text-anchor="middle" class="b" style="fill:#3d5a8a">정언 명령 ✔</text><text x="94" y="274" text-anchor="middle" class="xs">“정직하라.”</text><text x="94" y="288" text-anchor="middle" class="xs">조건 없이 무조건</text><rect x="186" y="236" width="160" height="64" rx="10" fill="#f4f1ea" stroke="#cfc6b5" stroke-width="1.3"/><text x="266" y="256" text-anchor="middle" class="b" style="fill:#6b6252">가언 명령</text><text x="266" y="274" text-anchor="middle" class="xs">“신용을 얻으려면</text><text x="266" y="288" text-anchor="middle" class="xs">정직하라.” (조건부)</text></svg>