ext><rect x="14" y="170" width="196" height="44" rx="10" fill="#ebf4ed" stroke="#acd2b4" stroke-width="1.3"/><text x="26" y="189" text-anchor="start" class="b">사양지심</text><text x="26" y="206" text-anchor="start" class="s" style="fill:#6b6252">양보하고 공경하는 마음</text><path d="M232,206 L232,192" stroke="#5aa469" stroke-width="2.2" stroke-linecap="round"/><path d="M232,196 q-10,-4 -11,-12 q9,0 11,10z" fill="#5aa469"/><path d="M232,193 q9,-4 11,-13 q-10,1 -11,11z" fill="#5aa469"/><line x1="248" y1="192" x2="279.0" y2="192.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="282,192 275.7,195.0 275.7,189.0" fill="#5a5246"/><text x="265" y="184" text-anchor="middle" class="xs" style="fill:#7a7264">확충</text><circle cx="318" cy="192" r="21" fill="#5aa469" stroke="none" stroke-width="1.3"/><text x="318" y="190" text-anchor="middle" class="bw">예</text><text x="318" y="204" text-anchor="middle" class="xs" style="fill:#fff">禮</text><rect x="14" y="222" width="196" height="44" rx="10" fill="#f1edf7" stroke="#c6b5df" stroke-width="1.3"/><text x="26" y="241" text-anchor="start" class="b">시비지심</text><text x="26" y="258" text-anchor="start" class="s" style="fill:#6b6252">옳고 그름을 가리는 마음</text><path d="M232,258 L232,244" stroke="#5aa469" stroke-width="2.2" stroke-linecap="round"/><path d="M232,248 q-10,-4 -11,-12 q9,0 11,10z" fill="#5aa469"/><path d="M232,245 q9,-4 11,-13 q-10,1 -11,11z" fill="#5aa469"/><line x1="248" y1="244" x2="279.0" y2="244.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="282,244 275.7,247.0 275.7,241.0" fill="#5a5246"/><text x="265" y="236" text-anchor="middle" class="xs" style="fill:#7a7264">확충</text><circle cx="318" cy="244" r="21" fill="#8c6bbf" stroke="none" stroke-width="1.3"/><text x="318" y="242" text-anchor="middle" class="bw">지</text><text x="318" y="256" text-anchor="middle" class="xs" style="fill:#fff">智</text><rect x="14" y="278" width="332" height="30" rx="8" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="180" y="298" text-anchor