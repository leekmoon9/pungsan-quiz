<text x="180" y="30" text-anchor="middle" class="t">사형 제도에 대한 사상가의 입장</text><rect x="14" y="46" width="332" height="66" rx="10" fill="#fff" stroke="#94a4bf" stroke-width="1.3"/><text x="26" y="70" text-anchor="start" class="b">칸트</text><rect x="26" y="80" width="44" height="22" rx="11.0" fill="#3d5a8a"/><text x="48.0" y="95.5" text-anchor="middle" class="xs b" style="fill:#fff">찬성</text><text x="96" y="72" text-anchor="start" class="xs b">동해 보복: 살인 = 사형</text><text x="96" y="92" text-anchor="start" class="xs" style="fill:#4a4236">사형은 범죄자를 이성적 존재로 대우(인격 존중)</text><rect x="14" y="120" width="332" height="66" rx="10" fill="#fff" stroke="#94a4bf" stroke-width="1.3"/><text x="26" y="144" text-anchor="start" class="b">루소</text><rect x="26" y="154" width="44" height="22" rx="11.0" fill="#3d5a8a"/><text x="48.0" y="169.5" text-anchor="middle" class="xs b" style="fill:#fff">찬성</text><text x="96" y="146" text-anchor="start" class="xs b">사회 계약: 생명 보존을 위한 약속</text><text x="96" y="166" text-anchor="start" class="xs" style="fill:#4a4236">살인자는 계약 위반 → 시민 아닌 사회의 적</text><rect x="14" y="194" width="332" height="66" rx="10" fill="#fff" stroke="#e7a295" stroke-width="1.3"/><text x="26" y="218" text-anchor="start" class="b">베카리아</text><rect x="26" y="228" width="44" height="22" rx="11.0" fill="#d4553f"/><text x="48.0" y="243.5" text-anchor="middle" class="xs b" style="fill:#fff">반대</text><text x="96" y="220" text-anchor="start" class="xs b">공리주의: 종신 노역형이 예방에 더 효과</text><text x="96" y="240" text-anchor="start" class="xs" style="fill:#4a4236">사회 계약: 생명 처분권은 양도 불가</text></svg>