<text x="180" y="30" text-anchor="middle" class="t">도덕적 고려의 범위가 넓어진다</text><circle cx="150" cy="176" r="132" fill="#e1efe4" stroke="#5aa469" stroke-width="1.5"/><text x="150" y="60" text-anchor="middle" class="xs b" style="fill:#3a3226">생태 중심주의</text><circle cx="150" cy="176" r="100" fill="#dcedec" stroke="#3f9a95" stroke-width="1.5"/><text x="150" y="92" text-anchor="middle" class="xs b" style="fill:#3a3226">생명 중심주의</text><circle cx="150" cy="176" r="68" fill="#faeddc" stroke="#e39b3a" stroke-width="1.5"/><text x="150" y="124" text-anchor="middle" class="xs b" style="fill:#3a3226">동물 중심주의</text><circle cx="150" cy="176" r="36" fill="#4f86c6" stroke="#4f86c6" stroke-width="1.5"/><text x="150" y="174" text-anchor="middle" class="bw">인간</text><text x="150" y="188" text-anchor="middle" class="xs" style="fill:#fff">중심</text><rect x="14" y="318" width="332" height="98" rx="10" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/><circle cx="28" cy="334" r="5" fill="#4f86c6" stroke="none" stroke-width="1.3"/><text x="40" y="338" text-anchor="start" class="xs b">인간</text><text x="72" y="338" text-anchor="start" class="xs">이성 → 칸트·데카르트</text><circle cx="28" cy="355" r="5" fill="#e39b3a" stroke="none" stroke-width="1.3"/><text x="40" y="359" text-anchor="start" class="xs b">동물</text><text x="72" y="359" text-anchor="start" class="xs">쾌고 감수 능력(싱어)·삶의 주체(레건)</text><circle cx="28" cy="376" r="5" fill="#3f9a95" stroke="none" stroke-width="1.3"/><text x="40" y="380" text-anchor="start" class="xs b">생명</text><text x="72" y="380" text-anchor="start" class="xs">생명 외경(슈바이처)·목적론적 삶의 중심(테일러)</text><circle cx="28" cy="397" r="5" fill="#5aa469" stroke="none" stroke-width="1.3"/><text x="40" y="401" text-anchor="start" class="xs b">생태</text><text x="72" y="401" text-anchor="start" class="xs">대지 윤리(레오폴드)·심층 생태주의(네스)</text><text x="296" y="120" text-anchor="start" class="xs" style="fill:#6b6252">← 개체론</text><text x="296" y="134" text-anchor="start" class="xs" style="fill:#6b6252">(인간·동물·</text><text x="296" y="148" text-anchor="start" class="xs" style="fill:#6b6252">생명 중심)</text><text x="290" y="236" text-anchor="start" class="xs" style="fill:#4a6a4a">← 전일론</text><text x="290" y="250" text-anchor="start" class="xs" style="fill:#4a6a4a">(생태 중심)</text></svg>