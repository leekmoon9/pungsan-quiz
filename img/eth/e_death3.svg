<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 252" width="720" height="504">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="250" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">죽음의 세 가지 특성</text><circle cx="66" cy="92" r="40" fill="#eae4f3" stroke="#8c6bbf" stroke-width="1.6"/><text x="66" y="98" text-anchor="middle" class="b" style="fill:#8c6bbf">보편성</text><text x="66" y="152" text-anchor="middle" class="s">누구에게나</text><text x="66" y="169" text-anchor="middle" class="s">찾아온다</text><circle cx="180" cy="92" r="40" fill="#dce1ea" stroke="#3d5a8a" stroke-width="1.6"/><text x="180" y="98" text-anchor="middle" class="b" style="fill:#3d5a8a">불가피성</text><text x="180" y="152" text-anchor="middle" class="s">결코 피할 수</text><text x="180" y="169" text-anchor="middle" class="s">없다</text><circle cx="294" cy="92" r="40" fill="#eae4de" stroke="#8a6a46" stroke-width="1.6"/><text x="294" y="98" text-anchor="middle" class="b" style="fill:#8a6a46">일회성</text><text x="294" y="152" text-anchor="middle" class="s">단 한 번,</text><text x="294" y="169" text-anchor="middle" class="s">다시 살 수 없다</text><rect x="14" y="190" width="332" height="48" rx="10" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="180" y="210" text-anchor="middle" class="s b">삶의 유한성 자각 → 지금의 삶을 더 소중히</text><text x="180" y="228" text-anchor="middle" class="s">웰다잉: 존엄한 죽음을 준비하는 과정·태도</text></svg>