<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 374" width="720" height="748">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="372" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">분배의 네 가지 기준</text><rect x="14" y="46" width="332" height="74" rx="10" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/><path d="M46,83 L46.0,59.0 A24,24 0 0 1 70.0,83.0Z" fill="#7ba4d4" stroke="#fff" stroke-width="1.5"/><path d="M46,83 L70.0,83.0 A24,24 0 0 1 46.0,107.0Z" fill="#eab46b" stroke="#fff" stroke-width="1.5"/><path d="M46,83 L46.0,107.0 A24,24 0 0 1 22.0,83.0Z" fill="#83bb8e" stroke="#fff" stroke-width="1.5"/><path d="M46,83 L22.0,83.0 A24,24 0 0 1 46.0,59.0Z" fill="#a990cf" stroke="#fff" stroke-width="1.5"/><text x="80" y="66" text-anchor="start" class="b">절대적 평등</text><text x="170" y="66" text-anchor="start" class="xs" style="fill:#7a7264">모두 똑같이</text><text x="80" y="85" text-anchor="start" class="xs" style="fill:#3c7a4a">＋ 균등한 기회·혜택</text><text x="80" y="102" text-anchor="start" class="xs" style="fill:#a33d2e">－ 생산 의욕 저하, 개인 자유 약화</text><text x="340" y="66" text-anchor="end" class="xs" style="fill:#7a7264">예) 재난 지원금</text><rect x="14" y="126" width="332" height="74" rx="10" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/><path d="M46,163 L46.0,139.0 A24,24 0 0 1 46.0,187.0Z" fill="#7ba4d4" stroke="#fff" stroke-width="1.5"/><path d="M46,163 L46.0,187.0 A24,24 0 0 1 25.2,175.0Z" fill="#eab46b" stroke="#fff" stroke-width="1.5"/><path d="M46,163 L25.2,175.0 A24,24 0 0 1 25.2,151.0Z" fill="#83bb8e" stroke="#fff" stroke-width="1.5"/><path d="M46,163 L25.2,151.0 A24,24 0 0 1 46.0,139.0Z" fill="#a990cf" stroke="#fff" stroke-width="1.5"/><text x="80" y="146" text-anchor="start" class="b">필요</text><text x="114" y="146" text-anchor="start" class="xs" style="fill:#7a7264">기본적 욕구에 따라</text><text x="80" y="165" text-anchor="start" class="xs" style="fill:#3c7a4a">＋ 약자 보호, 불평등 완화</text><text x="80" y="182" text-anchor="start" class="xs" style="fill:#a33d2e">－ 한정된 재화, 노동 의욕 감소</text><text x="340" y="146" text-anchor="end" class="xs" style="fill:#7a7264">예) 기초 연금·실업 급여</text><rect x="14" y="206" width="332" height="74" rx="10" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/><path d="M46,243 L46.0,219.0 A24,24 0 0 1 64.8,228.0Z" fill="#7ba4d4" stroke="#fff" stroke-width="1.5"/><path d="M46,243 L64.8,228.0 A24,24 0 0 1 66.0,256.2Z" fill="#eab46b" stroke="#fff" stroke-width="1.5"/><path d="M46,243 L66.0,256.2 A24,24 0 0 1 28.7,259.6Z" fill="#83bb8e" stroke="#fff" stroke-width="1.5"/><path d="M46,243 L28.7,259.6 A24,24 0 0 1 46.0,219.0Z" fill="#a990cf" stroke="#fff" stroke-width="1.5"/><text x="80" y="226" text-anchor="start" class="b">능력</text><text x="114" y="226" text-anchor="start" class="xs" style="fill:#7a7264">맡은 일을 해내는 힘</text><text x="80" y="245" text-anchor="start" class="xs" style="fill:#3c7a4a">＋ 잠재 역량 발휘 동기</text><text x="80" y="262" text-anchor="start" class="xs" style="fill:#a33d2e">－ 우연적 요소 개입, 평가 기준 모호</text><text x="340" y="226" text-anchor="end" class="xs" style="fill:#7a7264">예) 외국어 우대 채용</text><rect x="14" y="286" width="332" height="74" rx="10" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/><path d="M46,323 L46.0,299.0 A24,24 0 0 1 60.1,303.6Z" fill="#7ba4d4" stroke="#fff" stroke-width="1.5"/><path d="M46,323 L60.1,303.6 A24,24 0 0 1 69.9,325.5Z" fill="#eab46b" stroke="#fff" stroke-width="1.5"/><path d="M46,323 L69.9,325.5 A24,24 0 0 1 41.0,346.5Z" fill="#83bb8e" stroke="#fff" stroke-width="1.5"/><path d="M46,323 L41.0,346.5 A24,24 0 0 1 46.0,299.0Z" fill="#a990cf" stroke="#fff" stroke-width="1.5"/><text x="80" y="306" text-anchor="start" class="b">업적</text><text x="114" y="306" text-anchor="start" class="xs" style="fill:#7a7264">실제 기여·성과</text><text x="80" y="325" text-anchor="start" class="xs" style="fill:#3c7a4a">＋ 기준 명확, 성취 의욕↑</text><text x="80" y="342" text-anchor="start" class="xs" style="fill:#a33d2e">－ 다른 업적 비교 어려움, 약자 소외</text><text x="340" y="306" text-anchor="end" class="xs" style="fill:#7a7264">예) 판매 실적 보상</text></svg>