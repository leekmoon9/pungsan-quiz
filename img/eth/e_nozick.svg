<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 264" width="720" height="528">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="262" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">노직: 소유권으로서의 정의</text><rect x="14" y="48" width="104" height="92" rx="12" fill="#ebf4ed" stroke="#5aa469" stroke-width="1.5"/><text x="66" y="74" text-anchor="middle" class="b" style="fill:#5aa469">취득의 원칙</text><text x="66" y="98" text-anchor="middle" class="xs">정당하게 얻은</text><text x="66" y="114" text-anchor="middle" class="xs">소유물은 내 것</text><line x1="118" y1="94" x2="127.0" y2="94.0" stroke="#5a5246" stroke-width="1.4"/><polygon points="130,94 123.7,97.0 123.7,91.0" fill="#5a5246"/><rect x="130" y="48" width="104" height="92" rx="12" fill="#eaf0f8" stroke="#4f86c6" stroke-width="1.5"/><text x="182" y="74" text-anchor="middle" class="b" style="fill:#4f86c6">이전의 원칙</text><text x="182" y="98" text-anchor="middle" class="xs">자발적 교환·</text><text x="182" y="114" text-anchor="middle" class="xs">증여도 정당</text><line x1="234" y1="94" x2="243.0" y2="94.0" stroke="#5a5246" stroke-width="1.4"/><polygon points="246,94 239.7,97.0 239.7,91.0" fill="#5a5246"/><rect x="246" y="48" width="104" height="92" rx="12" fill="#faebe8" stroke="#d4553f" stroke-width="1.5"/><text x="298" y="74" text-anchor="middle" class="b" style="fill:#d4553f">교정의 원칙</text><text x="298" y="98" text-anchor="middle" class="xs">부당한 취득·이전은</text><text x="298" y="114" text-anchor="middle" class="xs">바로잡기</text><rect x="14" y="154" width="332" height="96" rx="10" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="26" y="176" text-anchor="start" class="s">• 역사적 원리: 과정이 정당하면 결과도 정의롭다</text><text x="26" y="195" text-anchor="start" class="s">• 정형화된 분배(국가의 재분배) 반대</text><text x="26" y="214" text-anchor="start" class="s">• 근로 소득 과세 ≈ 강제 노동</text><text x="26" y="233" text-anchor="start" class="s">• 최소 국가: 폭력·사기·도둑·계약 위반에서 보호</text></svg>