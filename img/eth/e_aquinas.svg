<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 326" width="720" height="652">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="324" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">아퀴나스의 자연법 윤리</text><polygon points="109.0,48 109.0,48 140.7,106 77.3,106" fill="#3d5a8a" stroke="#fff" stroke-width="2"/><text x="109.0" y="92" text-anchor="middle" class="bw">영원법</text><polygon points="77.3,108 140.7,108 172.3,166 45.7,166" fill="#4f86c6" stroke="#fff" stroke-width="2"/><text x="109.0" y="138" text-anchor="middle" class="bw">자연법</text><text x="109.0" y="155" text-anchor="middle" class="xs" style="fill:#fff">보편적 · 이성으로 인식</text><polygon points="45.7,168 172.3,168 204.0,226 14.0,226" fill="#9ebce0" stroke="#fff" stroke-width="2"/><text x="109.0" y="198" text-anchor="middle" class="bw">실정법</text><text x="109.0" y="215" text-anchor="middle" class="xs" style="fill:#fff">자연법 기반 사회 질서</text><text x="109.0" y="65" text-anchor="middle" class=""></text><text x="281" y="70" text-anchor="middle" class="xs" style="fill:#7a7264">위로 갈수록 상위 법</text><text x="218" y="110" text-anchor="start" class="b">인간의 자연적 성향</text><rect x="218" y="120" width="124" height="24" rx="12.0" fill="#d6e8da"/><text x="280.0" y="136.5" text-anchor="middle" class="s b" style="fill:#2a2620">① 자기 보존</text><rect x="218" y="150" width="124" height="24" rx="12.0" fill="#d6e8da"/><text x="280.0" y="166.5" text-anchor="middle" class="s b" style="fill:#2a2620">② 종족 보존</text><rect x="218" y="180" width="124" height="40" rx="12" fill="#d6e8da" stroke="none" stroke-width="1.3"/><text x="280" y="196" text-anchor="middle" class="s b">③ 신과 사회에 대한</text><text x="280" y="211" text-anchor="middle" class="s b">진리 파악</text><rect x="14" y="240" width="332" height="52" rx="10" fill="#fbeeec" stroke="#eaaa9f" stroke-width="1.3"/><text x="180" y="261" text-anchor="middle" class="b">기본 원칙: “선을 추구하고 악을 피하라.”</text><text x="180" y="280" text-anchor="middle" class="s">이성과 직관으로 성향 인식 → 도덕적 의무 도출</text><text x="180" y="312" text-anchor="middle" class="s" style="fill:#6b6252">예) 자기 보존 성향 → 살인·자살은 자연법에 어긋남</text></svg>