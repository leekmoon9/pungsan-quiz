<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="360" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">유교의 공동체 윤리: 나에서 세상으로</text><circle cx="126" cy="172" r="112" fill="#f9ebd8" stroke="#e39b3a" stroke-width="1.4"/><text x="126" y="77" text-anchor="middle" class="s b" style="fill:#3a3226">평천하 · 세상</text><circle cx="126" cy="172" r="84" fill="#deede1" stroke="#5aa469" stroke-width="1.4"/><text x="126" y="105" text-anchor="middle" class="s b" style="fill:#3a3226">치국 · 나라</text><circle cx="126" cy="172" r="56" fill="#dce7f4" stroke="#4f86c6" stroke-width="1.4"/><text x="126" y="133" text-anchor="middle" class="s b" style="fill:#3a3226">제가 · 가정</text><circle cx="126" cy="172" r="30" fill="#d4553f" stroke="#d4553f" stroke-width="1.4"/><text x="126" y="170" text-anchor="middle" class="bw">수신</text><text x="126" y="185" text-anchor="middle" class="xs" style="fill:#fff">나</text><text x="256" y="84" text-anchor="start" class="b">자기 수양이</text><text x="256" y="101" text-anchor="start" class="b">먼저!</text><line x1="272" y1="120" x2="272.0" y2="141.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="272,144 269.0,137.7 275.0,137.7" fill="#5a5246"/><text x="256" y="164" text-anchor="start" class="s">가족 사랑</text><text x="256" y="181" text-anchor="start" class="s">(효제)에서</text><line x1="272" y1="194" x2="272.0" y2="215.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="272,218 269.0,211.7 275.0,211.7" fill="#5a5246"/><text x="256" y="238" text-anchor="start" class="s">타인·세상으로</text><text x="256" y="255" text-anchor="start" class="s">사랑 확대</text><rect x="14" y="302" width="332" height="46" rx="10" fill="#fcf3e7" stroke="#eec389" stroke-width="1.3"/><text x="180" y="321" text-anchor="middle" class="b">목표 → 대동(大同) 사회</text><text x="180" y="339" text-anchor="middle" class="s">차별 없이 고르게 나누며 더불어 사는 도덕 공동체</text></svg>