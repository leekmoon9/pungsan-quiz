<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" width="720" height="688">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="342" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">아리스토텔레스의 중용</text><text x="180" y="48" text-anchor="middle" class="m">지나치지도 모자라지도 않은, 상황에 맞는 적절함</text><text x="60" y="74" text-anchor="middle" class="s b" style="fill:#4f86c6">부족</text><text x="180" y="74" text-anchor="middle" class="s b" style="fill:#5aa469">중용</text><text x="300" y="74" text-anchor="middle" class="s b" style="fill:#d4553f">과도</text><defs><linearGradient id="g84" x1="0" x2="1"><stop offset="0" stop-color="#c1d5eb"/><stop offset=".5" stop-color="#c5dfca"/><stop offset="1" stop-color="#f0c4bc"/></linearGradient></defs><rect x="14" y="84" width="332" height="34" rx="17" fill="url(#g84)"/><text x="60" y="106" text-anchor="middle" class="s">비겁함</text><text x="300" y="106" text-anchor="middle" class="s">무모함</text><rect x="140" y="88" width="80" height="26" rx="13.0" fill="#5aa469"/><text x="180.0" y="105.5" text-anchor="middle" class="b" style="fill:#fff">용기</text><defs><linearGradient id="g126" x1="0" x2="1"><stop offset="0" stop-color="#c1d5eb"/><stop offset=".5" stop-color="#c5dfca"/><stop offset="1" stop-color="#f0c4bc"/></linearGradient></defs><rect x="14" y="126" width="332" height="34" rx="17" fill="url(#g126)"/><text x="60" y="148" text-anchor="middle" class="s">무감각</text><text x="300" y="148" text-anchor="middle" class="s">방종</text><rect x="140" y="130" width="80" height="26" rx="13.0" fill="#5aa469"/><text x="180.0" y="147.5" text-anchor="middle" class="b" style="fill:#fff">절제</text><defs><linearGradient id="g168" x1="0" x2="1"><stop offset="0" stop-color="#c1d5eb"/><stop offset=".5" stop-color="#c5dfca"/><stop offset="1" stop-color="#f0c4bc"/></linearGradient></defs><rect x="14" y="168" width="332" height="34" rx="17" fill="url(#g168)"/><text x="60" y="190" text-anchor="middle" class="s">무기력</text><text x="300" y="190" text-anchor="middle" class="s">성급함</text><rect x="140" y="172" width="80" height="26" rx="13.0" fill="#5aa469"/><text x="180.0" y="189.5" text-anchor="middle" class="b" style="fill:#fff">온화</text><defs><linearGradient id="g210" x1="0" x2="1"><stop offset="0" stop-color="#c1d5eb"/><stop offset=".5" stop-color="#c5dfca"/><stop offset="1" stop-color="#f0c4bc"/></linearGradient></defs><rect x="14" y="210" width="332" height="34" rx="17" fill="url(#g210)"/><text x="60" y="232" text-anchor="middle" class="s">인색</text><text x="300" y="232" text-anchor="middle" class="s">낭비</text><rect x="140" y="214" width="80" height="26" rx="13.0" fill="#5aa469"/><text x="180.0" y="231.5" text-anchor="middle" class="b" style="fill:#fff">후덕</text><rect x="14" y="256" width="332" height="48" rx="10" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="180" y="276" text-anchor="middle" class="s b">중용 ≠ 수학적 가운데</text><text x="180" y="294" text-anchor="middle" class="s">도둑질·살인처럼 그 자체로 나쁜 행위에는 중용이 없다</text><text x="180" y="328" text-anchor="middle" class="b" style="fill:#5aa469">좋은 행동 반복 → 습관화 → 덕(품성) → 행복</text></svg>