<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 342" width="720" height="684">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="340" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">롤스: 공정으로서의 정의</text><rect x="14" y="46" width="332" height="78" rx="12" fill="#eceef3" stroke="#a8b5ca" stroke-width="1.3"/><text x="26" y="68" text-anchor="start" class="b" style="fill:#3d5a8a">원초적 입장</text><text x="26" y="88" text-anchor="start" class="xs">무지의 베일: 내 신분·능력·가치관을 모름</text><text x="26" y="104" text-anchor="start" class="xs">이기적이지만 합리적 → 최악을 피하는 쪽으로 합의</text><path d="M300,60 q16,-6 32,0 v40 q-16,8 -32,0z" fill="#bbc5d6" stroke="#3d5a8a" stroke-width="1.2"/><circle cx="316" cy="74" r="6" fill="#fff" stroke="none" stroke-width="1.3"/><line x1="180" y1="126" x2="180.0" y2="143.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="180,146 177.0,139.7 183.0,139.7" fill="#5a5246"/><rect x="14" y="148" width="332" height="46" rx="10" fill="#e6eef7" stroke="#4f86c6" stroke-width="1.5"/><text x="26" y="168" text-anchor="start" class="b" style="fill:#3d5a8a">제1원칙  평등한 자유의 원칙</text><text x="26" y="186" text-anchor="start" class="xs">모든 사람에게 기본적 자유를 평등하게</text><text x="180" y="212" text-anchor="middle" class="xs b" style="fill:#d4553f">▲ 제1원칙이 제2원칙보다 우선</text><rect x="14" y="220" width="332" height="86" rx="10" fill="#fcf3e7" stroke="#e39b3a" stroke-width="1.5"/><text x="26" y="240" text-anchor="start" class="b" style="fill:#a35a10">제2원칙  사회·경제적 불평등은…</text><text x="26" y="262" text-anchor="start" class="s">① 차등의 원칙: 최소 수혜자에게 최대 이익</text><text x="26" y="284" text-anchor="start" class="s">② 공정한 기회균등의 원칙: 직위는 모두에게 개방</text><text x="180" y="326" text-anchor="middle" class="s b" style="fill:#4a4236">순수 절차적 정의: 절차가 공정하면 결과도 공정</text></svg>