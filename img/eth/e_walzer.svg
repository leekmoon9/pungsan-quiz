<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="720" height="620">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="308" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">왈처: 복합 평등</text><text x="180" y="48" text-anchor="middle" class="m">영역마다 다른 기준으로 분배해야 한다</text><circle cx="80" cy="110" r="44" fill="#e5f0e7" stroke="#5aa469" stroke-width="1.5"/><text x="80" y="108" text-anchor="middle" class="s b">안전·복지</text><text x="80" y="125" text-anchor="middle" class="xs" style="fill:#6b6252">필요</text><circle cx="180" cy="96" r="44" fill="#fbefdf" stroke="#e39b3a" stroke-width="1.5"/><text x="180" y="94" text-anchor="middle" class="s b">부(돈)</text><text x="180" y="111" text-anchor="middle" class="xs" style="fill:#6b6252">자유 교환</text><circle cx="280" cy="110" r="44" fill="#e3ecf6" stroke="#4f86c6" stroke-width="1.5"/><text x="280" y="108" text-anchor="middle" class="s b">기본 교육</text><text x="280" y="125" text-anchor="middle" class="xs" style="fill:#6b6252">엄격한 평등</text><circle cx="110" cy="190" r="44" fill="#ede7f5" stroke="#8c6bbf" stroke-width="1.5"/><text x="110" y="188" text-anchor="middle" class="s b">고등 교육</text><text x="110" y="205" text-anchor="middle" class="xs" style="fill:#6b6252">시장·공적</text><circle cx="250" cy="190" r="44" fill="#e0e5ec" stroke="#3d5a8a" stroke-width="1.5"/><text x="250" y="188" text-anchor="middle" class="s b">정치권력</text><text x="250" y="205" text-anchor="middle" class="xs" style="fill:#6b6252">돈으로 사면 ✕</text><path d="M210,128 Q240,150 236,160" fill="none" stroke="#d4553f" stroke-width="2" stroke-dasharray="4 3"/><circle cx="228" cy="146" r="9" fill="#fff" stroke="#d4553f" stroke-width="2"/><line x1="222" y1="152" x2="234" y2="140" stroke="#d4553f" stroke-width="2"/><rect x="14" y="248" width="332" height="48" rx="10" fill="#fcf1f0" stroke="#ecb2a9" stroke-width="1.3"/><text x="180" y="268" text-anchor="middle" class="s b">한 영역의 지배력(돈)으로 다른 영역(권력)을</text><text x="180" y="286" text-anchor="middle" class="s">차지하면 부정의 → 공동체주의</text></svg>