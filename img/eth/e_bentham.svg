<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 312" width="720" height="624">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="310" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">벤담: 쾌락의 양을 계산하는 7가지 기준</text><rect x="14" y="48" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="26" y="72" text-anchor="start" class="b" style="fill:#a35a10">강도</text><text x="166" y="72" text-anchor="end" class="xs">얼마나 강한가</text><rect x="14" y="94" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="26" y="118" text-anchor="start" class="b" style="fill:#a35a10">확실성</text><text x="166" y="118" text-anchor="end" class="xs">얼마나 확실한가</text><rect x="14" y="140" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="26" y="164" text-anchor="start" class="b" style="fill:#a35a10">지속성</text><text x="166" y="164" text-anchor="end" class="xs">얼마나 오래가나</text><rect x="14" y="186" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="26" y="210" text-anchor="start" class="b" style="fill:#a35a10">신속성</text><text x="166" y="210" text-anchor="end" class="xs">얼마나 빨리 얻나</text><rect x="184" y="48" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="196" y="72" text-anchor="start" class="b" style="fill:#a35a10">다산성</text><text x="336" y="72" text-anchor="end" class="xs">또 다른 쾌락을 낳나</text><rect x="184" y="94" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="196" y="118" text-anchor="start" class="b" style="fill:#a35a10">순수성</text><text x="336" y="118" text-anchor="end" class="xs">고통·부작용은 없나</text><rect x="184" y="140" width="162" height="38" rx="10" fill="#fcf3e7" stroke="#f1cd9c" stroke-width="1.3"/><text x="196" y="164" text-anchor="start" class="b" style="fill:#a35a10">범위</text><text x="336" y="164" text-anchor="end" class="xs">몇 명에게 미치나</text><rect x="184" y="186" width="162" height="38" rx="10" fill="#fff" stroke="#f1cd9c" stroke-width="1.2" stroke-dasharray="4 3"/><text x="265" y="210" text-anchor="middle" class="s b">→ 합산해서 비교!</text><rect x="14" y="240" width="332" height="58" rx="10" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="180" y="260" text-anchor="middle" class="s b">A: 10명에게 큰 만족 vs B: 200명에게 적당한 만족</text><text x="180" y="280" text-anchor="middle" class="s">→ 양과 범위를 종합해 전체 행복이 큰 쪽 선택</text></svg>