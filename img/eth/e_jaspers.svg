<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" width="720" height="628">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:15px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px} .xs{font-size:10.5px} .bw{fill:#fff;font-weight:700} .h{font-size:20px;font-weight:700}</style>
<rect x="1" y="1" width="358" height="312" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="30" text-anchor="middle" class="t">야스퍼스가 구분한 네 가지 죄</text><text x="180" y="48" text-anchor="middle" class="m">『죄의 문제』(제2차 세계 대전 후 독일인에게)</text><rect x="14" y="60" width="332" height="44" rx="10" fill="#faebe8" stroke="#e5998c" stroke-width="1.3"/><rect x="22" y="69" width="104" height="26" rx="13.0" fill="#d4553f"/><text x="74.0" y="86.5" text-anchor="middle" class="s b" style="fill:#fff">형사적 죄</text><text x="134" y="87" text-anchor="start" class="xs">법을 어긴 범죄 → 법정이 심판</text><rect x="14" y="112" width="332" height="44" rx="10" fill="#fcf3e7" stroke="#eec389" stroke-width="1.3"/><rect x="22" y="121" width="104" height="26" rx="13.0" fill="#e39b3a"/><text x="74.0" y="138.5" text-anchor="middle" class="s b" style="fill:#fff">정치적 죄</text><text x="134" y="139" text-anchor="start" class="xs">국가의 행위에 대한 국민의 책임</text><rect x="14" y="164" width="332" height="44" rx="10" fill="#ebf4ed" stroke="#9cc8a5" stroke-width="1.3"/><rect x="22" y="173" width="104" height="26" rx="13.0" fill="#5aa469"/><text x="74.0" y="190.5" text-anchor="middle" class="s b" style="fill:#fff">도덕적 죄</text><text x="134" y="191" text-anchor="start" class="xs">자신의 행위에 대한 양심의 심판</text><rect x="14" y="216" width="332" height="44" rx="10" fill="#eaf0f8" stroke="#95b6dd" stroke-width="1.3"/><rect x="22" y="225" width="104" height="26" rx="13.0" fill="#4f86c6"/><text x="74.0" y="242.5" text-anchor="middle" class="s b" style="fill:#fff">형이상학적 죄</text><text x="134" y="243" text-anchor="start" class="xs">불의를 막지 못하고 살아남은 인간으로서의 죄</text><rect x="14" y="270" width="332" height="30" rx="10" fill="#faf6ec" stroke="#e2d8c5" stroke-width="1.3"/><text x="180" y="290" text-anchor="middle" class="xs b">소수의 형사적 죄 + 모든 독일인의 정치적·도덕적 죄</text></svg>