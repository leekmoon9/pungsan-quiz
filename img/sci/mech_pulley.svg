<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 246" width="720" height="492">
<style>text{font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;fill:#2a2620;font-size:13px} .b{font-weight:700} .m{fill:#7a7264;font-size:11.5px} .t{font-size:14.5px;font-weight:700} .w{fill:#fff} .s{font-size:11.5px}</style>
<rect x="1" y="1" width="358" height="244" rx="14" fill="#fff" stroke="#e2d8c5" stroke-width="1.3"/>
<text x="180" y="24" text-anchor="middle" class="t">실로 연결된 두 물체</text><rect x="20" y="110" width="250" height="14" fill="#d9c9a8"/><rect x="250" y="124" width="20" height="110" fill="#d9c9a8"/><circle cx="270" cy="104" r="14" fill="#fff" stroke="#5a5246" stroke-width="2"/><circle cx="270" cy="104" r="3" fill="#5a5246"/><rect x="100" y="74" width="60" height="36" rx="4" fill="#cfe6f5" stroke="#5b8fc7" stroke-width="1.3"/><text x="130" y="97" text-anchor="middle" class="b" style="fill:#2a2620">M</text><line x1="160" y1="92" x2="270" y2="90" stroke="#5a5246" stroke-width="1.4"/><line x1="284" y1="104" x2="284" y2="160" stroke="#5a5246" stroke-width="1.4"/><rect x="268" y="160" width="32" height="32" rx="4" fill="#f6d9a6" stroke="#d29b44" stroke-width="1.3"/><text x="284" y="181" text-anchor="middle" class="b" style="fill:#2a2620">m</text><line x1="160" y1="88" x2="203.0" y2="88.0" stroke="#d1495b" stroke-width="2"/><polygon points="206,88 199.7,91.0 199.7,85.0" fill="#d1495b"/><text x="206" y="82" text-anchor="middle" class="b" style="fill:#d1495b">T</text><line x1="100" y1="92" x2="65.0" y2="92.0" stroke="#7a7264" stroke-width="2"/><polygon points="62,92 68.3,89.0 68.3,95.0" fill="#7a7264"/><text x="56" y="86" text-anchor="middle" class="b" style="fill:#7a7264">f</text><line x1="284" y1="160" x2="284.0" y2="135.0" stroke="#d1495b" stroke-width="2"/><polygon points="284,132 287.0,138.3 281.0,138.3" fill="#d1495b"/><text x="272" y="138" text-anchor="middle" class="b" style="fill:#d1495b">T</text><line x1="284" y1="192" x2="284.0" y2="229.0" stroke="#7d6bb5" stroke-width="2"/><polygon points="284,232 281.0,225.7 287.0,225.7" fill="#7d6bb5"/><text x="304" y="232" text-anchor="middle" class="b" style="fill:#7d6bb5">mg</text><text x="26" y="170" text-anchor="start" class="b">M:  T − f = Ma</text><text x="26" y="192" text-anchor="start" class="b">m:  mg − T = ma</text><text x="26" y="222" text-anchor="start" class="b" style="fill:#d1495b">더하면  a = (mg − f) / (M + m)</text></svg>