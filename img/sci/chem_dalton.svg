<text x="180" y="24" text-anchor="middle" class="t">부분 압력 법칙 (돌턴)</text><rect x="16" y="50" width="80" height="90" rx="8" fill="#fbf6ec" stroke="#5a5246" stroke-width="2"/><circle cx="81.6" cy="115.7" r="5" fill="#d1495b"/><circle cx="49.1" cy="87.5" r="5" fill="#d1495b"/><circle cx="30.6" cy="104.9" r="5" fill="#d1495b"/><circle cx="28.0" cy="63.0" r="5" fill="#d1495b"/><text x="56" y="160" text-anchor="middle" class="b">O₂ 2 기압</text><text x="110" y="100" text-anchor="middle" class="t">+</text><rect x="124" y="50" width="80" height="90" rx="8" fill="#fbf6ec" stroke="#5a5246" stroke-width="2"/><circle cx="145.4" cy="70.0" r="5" fill="#5b8fc7"/><circle cx="138.5" cy="84.9" r="5" fill="#5b8fc7"/><circle cx="133.6" cy="122.7" r="5" fill="#5b8fc7"/><circle cx="171.3" cy="69.0" r="5" fill="#5b8fc7"/><circle cx="186.3" cy="131.5" r="5" fill="#5b8fc7"/><circle cx="161.8" cy="93.8" r="5" fill="#5b8fc7"/><text x="164" y="160" text-anchor="middle" class="b">N₂ 3 기압</text><line x1="212" y1="95" x2="233.0" y2="95.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="236,95 229.7,98.0 229.7,92.0" fill="#5a5246"/><rect x="254" y="50" width="80" height="90" rx="8" fill="#fbf6ec" stroke="#5a5246" stroke-width="2"/><circle cx="267.5" cy="65.6" r="5" fill="#d1495b"/><circle cx="283.9" cy="77.6" r="5" fill="#d1495b"/><circle cx="315.0" cy="69.9" r="5" fill="#d1495b"/><circle cx="263.5" cy="128.4" r="5" fill="#d1495b"/><circle cx="295.8" cy="68.8" r="5" fill="#5b8fc7"/><circle cx="295.8" cy="130.4" r="5" fill="#5b8fc7"/><circle cx="317.3" cy="109.5" r="5" fill="#5b8fc7"/><circle cx="278.7" cy="85.1" r="5" fill="#5b8fc7"/><circle cx="272.7" cy="115.1" r="5" fill="#5b8fc7"/><circle cx="296.1" cy="115.7" r="5" fill="#5b8fc7"/><text x="294" y="160" text-anchor="middle" class="b">5 기압</text><text x="180" y="190" text-anchor="middle" class="b">같은 부피 용기에 섞으면  P = P(O₂) + P(N₂)</text><text x="180" y="210" text-anchor="middle" class="m">부분 압력 = 전체 압력 × 몰분율</text></svg>