<text x="180" y="24" text-anchor="middle" class="t">기체의 확산 — 엔트로피 증가</text><rect x="20" y="50" width="140" height="90" rx="6" fill="#fbf6ec" stroke="#5a5246" stroke-width="2"/><line x1="90" y1="50" x2="90" y2="140" stroke="#5a5246" stroke-width="2"/><circle cx="36.0" cy="70.0" r="6" fill="#7d6bb5"/><circle cx="60.0" cy="84.0" r="6" fill="#7d6bb5"/><circle cx="44.0" cy="110.0" r="6" fill="#7d6bb5"/><circle cx="72.0" cy="120.0" r="6" fill="#7d6bb5"/><text x="90" y="162" text-anchor="middle" class="s">칸막이 → 한쪽에 모임</text><line x1="170" y1="95" x2="187.0" y2="95.0" stroke="#5a5246" stroke-width="1.6"/><polygon points="190,95 183.7,98.0 183.7,92.0" fill="#5a5246"/><rect x="200" y="50" width="140" height="90" rx="6" fill="#fbf6ec" stroke="#5a5246" stroke-width="2"/><circle cx="222.0" cy="72.0" r="6" fill="#7d6bb5"/><circle cx="300.0" cy="84.0" r="6" fill="#7d6bb5"/><circle cx="250.0" cy="118.0" r="6" fill="#7d6bb5"/><circle cx="320.0" cy="120.0" r="6" fill="#7d6bb5"/><text x="270" y="162" text-anchor="middle" class="s">고르게 퍼짐 (저절로)</text><rect x="14" y="180" width="332" height="52" rx="10" fill="#fbf6ec" stroke="#efe5d2" stroke-width="1"/><text x="26" y="202" text-anchor="start" class="s">4개 모두 한쪽에 있을 확률 = (½)⁴ = 1/16</text><text x="26" y="222" text-anchor="start" class="s">입자가 많을수록 다시 모일 확률은 거의 0</text></svg>