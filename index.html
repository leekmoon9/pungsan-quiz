<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><link rel="manifest" href="manifest.webmanifest?v=3"><meta name="theme-color" content="#f3ede1"><link rel="apple-touch-icon" href="logo-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="풍산 문제">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>풍산고 기말 시험 대비</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3ede1;--card:#fbf8f1;--tx:#2a2620;--mut:#7a7264;--ac:#5b7fa8;--ok:#2e7d4f;--no:#b3392f;--bd:#e0d8c7;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Noto Sans KR",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.3;margin:0 0 6px}h2{margin:0 0 6px}h3{margin:18px 0 8px;font-size:16px}
.hero{position:relative;overflow:hidden;height:calc(100vh - 42px);height:calc(100svh - 42px);min-height:520px;display:grid;grid-template-rows:1fr auto 1fr;align-items:center;text-align:center;padding:0}
.sa{position:relative;align-self:stretch;min-height:0}
.sa.lo .st.r1{display:none}.sa.no .st{display:none}
.hc{position:relative;z-index:1;width:100%;margin:6px 0;display:flex;flex-direction:column;align-items:center}
.st{position:absolute;z-index:0;pointer-events:none;user-select:none;transform:rotate(var(--r));animation:pop .5s ease-out both}
img.st{border:none;border-radius:7px;box-shadow:0 3px 9px rgba(0,0,0,.3);height:auto;background:none;display:block}
.pl{padding:6px 12px;border-radius:999px;background:var(--pc);border:none;font-weight:700;font-size:13px;color:#2b2b2b;box-shadow:0 3px 9px rgba(0,0,0,.3);white-space:nowrap}
@keyframes pop{from{opacity:0}to{opacity:1}}
.hc{justify-self:center;width:min(100%,340px)!important;box-sizing:border-box;padding:24px 20px 22px;border-radius:26px;background:rgba(255,252,246,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 12px 32px rgba(90,70,40,.16),0 1px 0 rgba(255,255,255,.9) inset}
.hc h1{margin:0 0 10px;padding:0 4px;font-size:clamp(27px,7.6vw,34px);font-weight:800;letter-spacing:-1px;line-height:1.25;color:#2a2620;background:linear-gradient(transparent 60%,#f7d98b 60%,#f7d98b 88%,transparent 88%)}
.hc p{margin:0;color:#7a7264;font-size:15px}
.hc .mut{color:#8b8374}
.hc .row{width:100%}
.hc input,.hc .b{max-width:none!important;box-sizing:border-box}
.hc input[type=text],.hc input[type=password]{width:100%;background:#fff;border:1.5px solid #e6dfd0;border-radius:14px;padding:12px 16px;box-shadow:none;transition:border-color .2s}
.hc input[type=text]:focus,.hc input[type=password]:focus{outline:none;border-color:#8fb8ec}
.hc .b{background:#8fb8ec;color:#1d2b3a;border-radius:14px;box-shadow:0 4px 12px rgba(91,127,168,.28)}
.hc .b:disabled{box-shadow:none}

.ub{background:var(--bg);border:1.5px solid var(--uc);border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.14);position:relative}
.ub::before{content:"";position:absolute;top:0;left:0;bottom:0;width:22px;background:linear-gradient(to right,var(--uc) 0,var(--uc) 22%,transparent 100%);pointer-events:none}
.uh{position:relative;display:flex;align-items:center;gap:12px;padding:14px 12px 14px 26px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ut{flex:1;min-width:0}.ut>b{font-size:17px}
.ut .al{display:flex;justify-content:space-between;font-size:13px;margin:6px 0 5px}.ut .bar{margin:0;height:7px}
.ut .bar i{border-radius:4px;transition:width 1.05s cubic-bezier(.3,1.7,.5,1)}
.b.us{width:auto;flex:none;padding:9px 14px;min-height:0;font-size:14px}
.chev{font-size:24px;line-height:1;color:var(--mut);transition:transform .3s ease;width:14px;text-align:center}
.ub.op .chev{transform:rotate(90deg)}
.um{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.ub.op .um{grid-template-rows:1fr}
.umi{overflow:hidden;padding:0 12px 0 26px}
.ub.op .umi{padding-bottom:12px}
.mb{display:flex;justify-content:space-between;align-items:center;width:100%;margin:6px 0 0;padding:12px 14px;border:none;border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-weight:600;text-align:left;cursor:pointer;opacity:0;transform:translateY(-6px);transition:opacity .3s ease,transform .3s ease}
.ub.op .mb{opacity:1;transform:none}
.ub.op .mb:nth-child(2){transition-delay:.06s}.ub.op .mb:nth-child(3){transition-delay:.12s}.ub.op .mb:nth-child(4){transition-delay:.18s}
.mb .mut{font-weight:400;font-size:13px}
.ub.ua{margin-top:18px;background:var(--card);background:color-mix(in srgb,var(--uc) 22%,var(--bg))}
.ub.ua .ut>b{font-size:18px}
.qk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 2px}
.qk button{padding:13px 8px;border:none;border-radius:14px;background:var(--card);background:color-mix(in srgb,var(--ac) 26%,var(--card));color:var(--tx);font:inherit;font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(90,70,40,.1);cursor:pointer;-webkit-tap-highlight-color:transparent}
h3.sec{font-size:19px;font-weight:600;margin:20px 0 8px}
.fbw{min-height:calc(100vh - 60px);min-height:calc(100svh - 60px);display:flex;flex-direction:column;justify-content:center;text-align:center}
.fbw .tag{max-width:420px;margin:0 auto 6px}
.fbw textarea{text-align:left}
.hc .fbk{background:#fffcf6;color:#2b2b2b;border:none;border-radius:999px;padding:8px 18px;font:inherit;font-size:14px;font-weight:600;box-shadow:0 3px 10px rgba(0,0,0,.22);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tag{font-size:13px;color:var(--mut)}
.bar{height:8px;background:var(--bd);border:none;border-radius:999px;overflow:hidden;margin:8px 0;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.bar i{display:block;height:100%;background:var(--ac);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.card{background:var(--card);border:none;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.14)}
.q{font-weight:600;margin:6px 0 14px;white-space:pre-line}
.opt{display:block;width:100%;text-align:left;background:none;color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:11px 13px;margin:8px 0;font:inherit;cursor:pointer}
.opt.sel{border-color:var(--ac);background:var(--card);background:color-mix(in srgb,var(--ac) 12%,transparent)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--no)}
.pc{cursor:pointer}.pc:active{opacity:.7}
input[type=text],textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:8px;margin-top:12px}
.b{flex:1;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer;width:100%}
.b.g{background:none;color:var(--tx);border:1px solid var(--bd)}
.b.s{padding:8px;font-size:13px;font-weight:400}
button:disabled{opacity:.4}
.fb{margin-top:14px;padding:12px;border-radius:10px;border-left:4px solid;white-space:pre-line}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--no)}
.ok-t{color:var(--ok);font-weight:700}.no-t{color:var(--no);font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.nav span{width:26px;height:26px;border-radius:6px;border:1px solid var(--bd);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav .o{background:var(--ok);color:#fff;border-color:var(--ok)}.nav .x{background:var(--no);color:#fff;border-color:var(--no)}.nav .c{outline:2px solid var(--ac)}
.big{font-size:44px;font-weight:700;color:var(--ac)}
label.ck{display:block;padding:6px 0}
.mut{color:var(--mut);font-size:14px}
.wk{border-left:4px solid var(--no);padding-left:10px;margin:10px 0}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;padding:16px 26px;border-radius:14px;background:var(--card);background:color-mix(in srgb,var(--card) 82%,transparent);border:1px solid var(--bd);color:var(--tx);font:inherit;font-weight:600;white-space:nowrap;pointer-events:none;opacity:0;animation:tst 1.8s ease-in-out}
@keyframes tst{0%{opacity:0}20%{opacity:1}70%{opacity:1}100%{opacity:0}}
button,.pc,.nav span{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.in{animation:pg .3s ease both}@keyframes pg{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.in,.st{animation:none}}
.card.pc{position:relative}
.sg{display:grid;justify-content:center;gap:8px;margin:8px 0}
.sg.c2{grid-template-columns:repeat(2,1fr)}
.card.bk{margin:0;padding:12px;display:flex;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden;text-align:left}
.card.bk .gd{position:absolute;top:0;left:0;right:0;height:22px;pointer-events:none}
.card.bk .tp{position:relative;display:flex;align-items:center;gap:20px}
.card.bk img{width:52px;height:72px;object-fit:cover;border-radius:5px;box-shadow:0 1px 5px rgba(0,0,0,.3);flex:none;display:block}
.card.bk .nm{font-weight:700;font-size:17px;line-height:1.35;white-space:nowrap}
.card.bk .al{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.card.bk .bar{margin:0;height:8px}
.card.bk .bar i{border-radius:4px;transition:width 1.05s cubic-bezier(.3,1.7,.5,1)}.sg.c4{grid-template-columns:repeat(2,1fr)}
.sl{font-size:clamp(12px,3.4vw,15px)}
@media(max-width:520px),(pointer:coarse){main{max-width:520px;padding:14px 14px 28px}h1{font-size:24px}.hero{padding:0}.sg.c2,.sg.c4{grid-template-columns:repeat(2,1fr);gap:10px}.sl{font-size:17px}.card.bk img{width:44px;height:62px}.card.bk .nm{font-size:15px}.card.bk .tp{gap:14px}.b{min-height:50px}.opt{padding:15px 14px}.nav span{width:34px;height:34px;font-size:13px}.nav{gap:6px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><main id="app"></main>
<script>
const ETC=[
{t:'sh',q:'차량이 요금소의 첫 번째 게이트를 통과할 때, 차량 단말기와 가장 먼저 통신하는 장치는?',a:['제1기지국','1기지국'],m:'제1기지국',e:'첫 번째 게이트에 설치된 제1기지국과 통신이 일어난다.'},
{t:'sh',q:'제1기지국이 차량 단말기에서 받은 요금 징수 관련 데이터를 임시 저장소에 보관하는 이유는?',a:['잃어버리','분실','손실','잃지'],m:'데이터를 잃어버리지 않도록',e:'데이터를 잃어버리지 않도록 임시 저장소에 보관하면서 거의 동시에 지역요금소 ETC 서버로 전송한다.'},
{t:'mc',q:'전자요금징수시스템의 작동 과정을 순서대로 바르게 나열한 것은?',o:['차량 단말기→제1기지국→지역요금소 ETC 서버→도로공사 서버→지역요금소 ETC 서버→제2기지국→차량 단말기','차량 단말기→제2기지국→지역요금소 ETC 서버→도로공사 서버→제1기지국→차량 단말기','차량 단말기→제1기지국→도로공사 서버→지역요금소 ETC 서버→제2기지국→차량 단말기','제1기지국→차량 단말기→지역요금소 ETC 서버→제2기지국→도로공사 서버→차량 단말기'],a:0,e:'포스트잇 도식 그대로다. 요금 징수 관련 데이터는 제1기지국을 거쳐 올라가고, 징수할 요금에 관한 데이터는 제2기지국을 거쳐 내려온다.'},
{t:'mc',q:'지역요금소 ETC 서버가 요금 징수 관련 데이터를 받은 뒤 하는 일로 알맞은 것은?',o:['데이터를 분석한 후 도로공사 서버로 전송해 징수할 요금 데이터를 찾도록 요청한다','데이터를 임시 저장소에 보관한다','차량 단말기에 요금을 직접 징수한다','안내표시기에 결과를 표시한다'],a:0,e:'분석 → 전송 → 요청. 임시 저장은 제1기지국의 역할이다.'},
{t:'ox',q:'징수할 요금에 관한 데이터는 제1기지국을 경유하여 차량 단말기로 전송된다.',a:false,e:'제2기지국을 경유한다. 제1기지국은 올라가는 데이터, 제2기지국은 내려오는 데이터 담당이다.'},
{t:'sh',q:'요금이 실제로 징수되는 시점은 언제인가?',a:['수신','단말기'],m:'징수할 요금에 관한 데이터가 차량 단말기에 수신될 때',e:'데이터가 수신되면 차량 단말기를 통해 요금이 징수되고, 그 결과가 안내표시기로 운전자에게 안내된다.'},
{t:'ox',q:'요금 징수 결과는 안내표시기를 통해 운전자에게 안내된다.',a:true,e:'맞다. 과정의 마지막 단계다.'},
{t:'sh',q:'차량 단말기와 기지국 간 데이터 전송에 사용되는, 통신 규약에 따라 정해진 데이터 처리 방식은?',a:['시분할'],m:'시분할 방식',e:'동일한 크기로 분할된 시간 단위(타임 슬롯)를 데이터에 할당하여 처리하는 방식.'},
{t:'sh',q:'타임 슬롯이란 무엇인가?',a:['시간의단위','시간단위','동일한크기','분할된시간'],m:'동일한 크기로 분할된 시간의 단위',e:'타임 슬롯 자체가 시간의 단위이고, 그 집합체는 프레임이다.'},
{t:'ox',q:'타임 슬롯은 차량이 진입해야만 만들어진다.',a:false,e:'타임 슬롯은 차량이 진입하지 않아도 항상 만들어진다. 차량이 지나가면 그때 데이터에 할당된다.'},
{t:'sh',q:'차량 한 대가 지나갈 때 데이터에 할당된 타임 슬롯들이 이루는 하나의 집합체를 무엇이라 하는가?',a:['프레임'],m:'프레임',e:'슬롯은 단위, 프레임은 집합체. 16번 ④ 함정이 여기서 나온다.'},
{t:'mc',q:'타임 슬롯이 데이터에 할당될 때 기준이 되는 순서는?',o:['차량이 도착한 순서','규약으로 정해진 데이터 종류의 순서','데이터의 크기가 큰 순서','운전자가 설정한 순서'],a:1,e:'규약으로 정해진 데이터 종류의 순서에 따라 타임 슬롯이 할당된다.'},
{t:'sh',q:'타임 슬롯이 데이터에 할당되는 방식과 프레임이 구성되는 방식에 따라 시분할 방식을 두 가지로 나눌 때, 그 두 가지는?',a:['동기식&비동기식'],m:'동기식, 비동기식',e:'지문 3문단 마지막 문장.'},
{t:'ox',q:'동기식 시분할 방식에서는 데이터가 전송되지 않으면 해당 타임 슬롯이 빈 채로 남는다.',a:true,e:'종류별로 슬롯이 지정되어 있어 데이터가 없어도 다른 데이터가 쓸 수 없다.'},
{t:'ox',q:'동기식 시분할 방식에서는 하나의 프레임에 포함된 타임 슬롯의 개수가 차량마다 다르다.',a:false,e:'동기식은 모든 차량이 같고, 비동기식은 차량마다 다를 수 있다.'},
{t:'ox',q:'비동기식 시분할 방식에서는 전송되는 데이터가 없으면 타임 슬롯을 비워 두고 다음 데이터를 기다린다.',a:false,e:'비우지 않고 다음 순서에 해당하는 데이터에 타임 슬롯을 할당한다.'},
{t:'sh',q:'비동기식에서 전송되는 모든 데이터마다 주소 필드를 포함시키는 이유는?',a:['종류&확인','종류&알','종류&파악'],m:'타임 슬롯이 데이터 종류에 따라 정해지지 않으므로, 데이터의 종류를 확인하기 위해',e:'슬롯 위치로 종류를 알 수 없기 때문에 주소 필드가 필요하다.'},
{t:'sh',q:'동기식 시분할 방식의 단점(㉠)을 한 단어로 쓰면? (타임 슬롯이 어떻게 된다?)',a:['낭비'],m:'타임 슬롯이 일부 낭비된다',e:'오류 가능성은 낮지만 데이터에 할당되지 않은 슬롯이 존재해 일부 낭비된다.'},
{t:'sh',q:'비동기식 시분할 방식의 단점(㉡)은? (데이터 처리 과정에서 무엇이 높은가?)',a:['오류'],m:'오류 발생 가능성이 상대적으로 높다',e:'슬롯 낭비는 없지만 처리 과정에서 오류 발생 가능성이 높다.'},
{t:'mc',q:'동기식과 비동기식을 비교한 것으로 옳은 것은?',o:['동기식: 정확성 높음, 효율성 낮음 / 비동기식: 정확성 낮음, 효율성 높음','동기식: 정확성 낮음, 효율성 높음 / 비동기식: 정확성 높음, 효율성 낮음','둘 다 정확성 높음, 효율성 같음','동기식이 정확성·효율성 모두 높음'],a:0,e:'필기 표 그대로. 동기식은 정확하지만 낭비, 비동기식은 효율적이지만 오류 가능성이 높다.'},
{t:'ox',q:'최근 통신 기술의 발전과 교통 환경 변화로 새로운 장비가 도입되거나 통신 규약이 바뀌기도 한다.',a:true,e:'마지막 문단. 시스템의 변화는 계속되고 있다.'},
{t:'mc',q:'[기출 16] 윗글의 내용과 일치하지 않는 것은?',o:['전자요금징수시스템을 이용하면 요금 납부를 편리하게 할 수 있다.','차량 단말기와 기지국 간에는 데이터 전송이 무선으로 이루어진다.','시분할 방식에서 타임 슬롯은 차량이 진입하지 않아도 항상 만들어진다.','타임 슬롯은 동일한 크기로 분할된 시간의 단위들에 의해 구성된 집합체이다.','비동기식 시분할 방식은 전송되는 모든 데이터마다 주소 필드를 포함시켜 프레임이 구성된다.'],a:3,e:'④ 집합체는 프레임이다. 타임 슬롯은 시간의 단위 하나다.'},
{t:'mc',q:'[기출 17] [A]를 바탕으로 보기의 ㉮(차량 단말기), ㉯(제1기지국), ㉰(제2기지국), ㉱(지역요금소 ETC 서버), ㉲(도로공사 요금정산센터 서버)를 이해한 것으로 적절하지 않은 것은?',o:['㉮에서 ㉯로 요금 징수 관련 데이터가 전송된다.','㉯에서 ㉱로 요금 징수 관련 데이터가 전송된다.','㉰에서 ㉮로 징수할 요금에 관한 데이터가 전송된다.','㉱에서 ㉲로 요금 징수 관련 데이터가 전송되고, ㉱에서 ㉰로 징수할 요금에 관한 데이터가 전송된다.','㉲에서 ㉱로 징수할 요금에 관한 데이터가 전송되고, ㉲에서 ㉮로 요금 징수 관련 데이터가 전송된다.'],a:4,e:'⑤ ㉲는 단말기로 직접 보내지 않는다. 징수할 요금 데이터는 ㉲→㉱→㉰→㉮ 순이다. (기호 라벨은 사진 기준 추정, 필기 정답 ⑤와 일치)'},
{t:'mc',q:'[기출 18] 보기: (Ⓐ)은 동기식이 상대적으로 높고 비동기식이 낮다. 데이터 처리 과정의 효율성은 동기식이 상대적으로 (Ⓑ), 비동기식이 (Ⓒ). Ⓐ~Ⓒ로 가장 적절한 것은?',o:['오류 발생 가능성 / 낮고 / 높다','오류 발생 가능성 / 높고 / 낮다','데이터 손실 가능성 / 높고 / 낮다','데이터 처리 과정의 정확성 / 낮고 / 높다','데이터 처리 과정의 정확성 / 높고 / 낮다'],a:3,e:'동기식이 높은 것은 정확성, 효율성은 동기식이 낮고 비동기식이 높다.'},
{t:'mc',q:'[기출 19] 1번 차량(동기식)은 I-1 유, I-2 무, I-3 유, I-4 유. 2번 차량(비동기식)은 I-1 유, I-2 유, I-3 유, I-4 무. TS1부터 시작하고 두 차량 사이 슬롯은 없다. 적절하지 않은 반응은?',o:['TS2는 비워지는 슬롯으로, 1번 차량이 후불 카드를 사용하는 차량이 아니기 때문이겠군.','TS3과 TS7은 모두 차량 소유주와 카드 소지자가 일치하는지 확인할 수 있는 슬롯이겠군.','TS4에는 요금 감면 대상이라는 데이터가 있고, TS8에는 요금 감면 대상이 아니라는 데이터가 있겠군.','TS1로는 1번 차량의 정상 진입 여부를, TS7로는 2번 차량의 소유주·카드 소지자 일치 여부를 알 수 있겠군.','TS5에는 정상 진입 데이터가, TS6에는 후불 카드 사용 데이터가 담겨 있겠군.'],a:2,e:'1번(동기식)은 TS1~4 고정 4개. 2번(비동기식)은 I-4가 없어 TS5~7 세 개뿐이다. 따라서 TS8은 2번 차량의 슬롯이 아니고, 요금 감면 대상이 아니라는 데이터도 전송되지 않는다.'}
,
{t:'mc',q:'[응용 1] 하나의 차로를 1번(동기식), 2번(비동기식), 3번(비동기식) 차량이 간격 없이 순서대로 지나갔다. 데이터 유무는 아래와 같고 슬롯은 TS1부터 시작한다.\n1번: I-1 유, I-2 무, I-3 유, I-4 무\n2번: I-1 무, I-2 유, I-3 유, I-4 유\n3번: I-1 유, I-2 무, I-3 무, I-4 유\n적절하지 않은 것은?',o:['세 차량이 사용하는 타임 슬롯은 TS1~TS9로 모두 9개이다.','TS3에는 1번 차량의 I-3에 해당하는 데이터가 담긴다.','TS4는 1번 차량의 프레임에서 비어 있는 슬롯이다.','TS8에는 3번 차량의 I-1에 해당하는 데이터가 담긴다.','TS6에는 2번 차량의 I-2에 해당하는 데이터가 담긴다.'],a:4,e:'1번(동기식)은 4개 고정이라 TS1~4(TS2, TS4가 빈 슬롯). 2번(비동기식)은 데이터가 있는 I-2, I-3, I-4만 차례로 TS5, 6, 7에 담긴다. 따라서 TS6은 I-3이다. 3번은 TS8(I-1), TS9(I-4).'},
{t:'mc',q:'[응용 2] 4종류의 데이터 중 2종류만 전송하는 차량 100대가 연속으로 지나갈 때, 두 방식을 비교한 것으로 가장 적절한 것은? (차량당 프레임 구성은 지문 기준, 방식별로 모든 차량이 동일하게 처리된다고 가정)',o:['동기식: 총 200슬롯, 낭비 0 / 비동기식: 총 200슬롯, 낭비 0','동기식: 총 400슬롯, 낭비 200 / 비동기식: 총 200슬롯, 낭비 0','동기식: 총 400슬롯, 낭비 0 / 비동기식: 총 400슬롯, 낭비 200','동기식: 총 400슬롯, 낭비 200 / 비동기식: 총 400슬롯, 낭비 100','동기식: 총 200슬롯, 낭비 200 / 비동기식: 총 100슬롯, 낭비 0'],a:1,e:'동기식은 차량마다 4슬롯 고정이라 100대면 400슬롯이고 그중 데이터가 없는 200슬롯이 낭비된다. 비동기식은 데이터가 있는 2종류에만 슬롯을 주므로 200슬롯이고 낭비가 없다. 대신 오류 가능성이 높다.'},
{t:'mc',q:'[응용 3] 어떤 차량이 첫 번째 게이트를 정상 통과했으나 제2기지국이 고장 나 통신하지 못한다. 이때의 추론으로 가장 적절한 것은?',o:['제1기지국이 차량 단말기의 데이터를 받지 못한다.','도로공사 서버가 징수할 요금 데이터를 찾지 못한다.','요금 징수 관련 데이터는 ETC 서버까지 전송되지만, 징수할 요금 데이터가 단말기에 수신되지 못해 요금 징수와 결과 안내가 이루어지지 못한다.','요금은 정상 징수되지만 안내표시기 안내만 이루어지지 않는다.','제1기지국이 임시 저장소의 데이터를 삭제한다.'],a:2,e:'제1기지국 단계와 정산센터 조회는 정상이다. 징수는 징수할 요금 데이터가 단말기에 수신되어야 이루어지고(제2기지국 경유), 안내는 그 후다.'},
{t:'mc',q:'[응용 4] 데이터 종류가 I-1~I-4 네 가지일 때, 프레임에 대한 설명으로 가장 적절한 것은?',o:['동기식에서도 데이터가 없으면 프레임을 3개 슬롯으로 구성할 수 있다.','비동기식에서 프레임이 4개 슬롯이면 네 종류의 데이터가 모두 전송된 것이다.','비동기식 프레임은 모든 차량에서 항상 4개 슬롯이다.','동기식에서 I-2가 없으면 프레임은 3개 슬롯이 된다.','비동기식 프레임은 데이터 종류보다 많은 5개 슬롯이 될 수 있다.'],a:1,e:'동기식은 항상 4개 고정(①, ④ 오답). 비동기식은 전송된 데이터 수만큼의 슬롯이므로 최대 4개이며(③, ⑤ 오답), 4개라면 모두 전송된 것이다.'},
{t:'mc',q:'[응용 5] 요금소 운영 방식을 정하려는 상황에서 지문에 근거한 판단으로 가장 적절한 것은?',o:['오류 없는 처리가 최우선이면 비동기식을 택해야 한다. 슬롯이 낭비되지 않기 때문이다.','동기식은 모든 데이터에 주소 필드를 포함하므로 정확성이 높다.','효율성이 최우선이면 동기식을 택해야 하며, 이때 오류 가능성은 높아진다.','정확성을 중시하면 동기식을, 슬롯 낭비를 줄이려면 비동기식을 택할 수 있으나, 비동기식에서는 오류 가능성이 상대적으로 높은 점을 감수해야 한다.','두 방식은 정확성과 효율성이 동일해서 어느 쪽을 택해도 차이가 없다.'],a:3,e:'동기식은 오류 가능성이 낮고(정확성 높음) 슬롯이 낭비되며, 비동기식은 슬롯 낭비가 없고(효율성 높음) 오류 가능성이 높다. 주소 필드는 비동기식의 특징이다.'}
];

{t:"ox",q:"‘갑’은 4번 염색체 하단부 31.3번 염색대 위치에 ‘CTTT’가 ‘3-5’인 유전형을 가진다.",a:true,e:"염색체 번호(4), 하단부(q), 염색대(31.3), 반복 서열(CTTT), 결괏값(3-5)을 모두 읽어 낸 것이다."},
{t:"sh",q:"‘DNA 프로필’이란 무엇인가? (결괏값이라는 말을 넣어 쓰시오)",a:["결괏값"],m:"STR을 분석하여 ‘3-5’와 같은 결괏값으로 표기한 것",e:"노트 포스트잇의 ‘분석 결과 2-3’ 옆에 적은 DNA 프로필이 바로 이것이다."},
{t:"ox",q:"우리나라를 비롯한 여러 나라에서는 20개의 좌위를 표준으로 하여 과학수사에 동일하게 활용하고 있다.",a:true,e:"국가 간에 공통 좌위가 있다. (기출 30번 ⑤ 함정)"},
{t:"mc",q:"비교 샘플의 DNA 프로필이 20개 좌위에서 모두 동일할 때 지문의 설명으로 알맞은 것은?",o:["동일인일 확률이 정확히 100%이다.","동일인일 확률이 100%에 가깝다.","동일인일 확률이 50%이다.","20개 중 10개만 같아도 같은 결론이다.","동일인이 아닐 확률이 더 높다."],a:1,e:"‘100%에 가깝다’이지 100%가 아니다."},
{t:"ox",q:"좌위의 개수가 늘어날수록 더 정밀한 분석이 가능할 것이다.",a:true,e:"마지막 문단. ⓔ정밀한은 ‘정교하고 치밀한’이다."},
{t:"sh",q:"노트 정리: 좌위 찾기 → ( ? ) → 여러 좌위 비교 → 동일인 여부 판단. 괄호 안에 들어갈 내용은?",a:["횟수"],m:"염기 서열이 반복되는 횟수 세기",e:"STR 분석법의 4단계 흐름이다."},
{t:"mc",q:"[기출 29] 윗글에 대한 이해로 가장 적절한 것은?",o:["사람마다 DNA를 구성하는 염기 종류가 다르다.","상동 염색체는 서로 다른 모양을 가진 한 쌍으로 존재한다.","STR 분석을 위해서는 먼저 염색체의 개수를 파악해야 한다.","20개의 표준 좌위에서는 염기 서열의 STR이 나타나지 않는다.","STR 분석법은 DNA에 있는 30억 개 염기 중 일부를 대상으로 한다."],a:4,e:"① 염기 종류는 4가지로 같다. ② 동일한 모양과 크기다. ③ 먼저 파악해야 하는 것은 좌위다. ④ 좌위에서 STR을 분석한다."},
{t:"mc",q:"[기출 30] 윗글을 읽고 추론한 내용으로 가장 적절한 것은?",o:["DNA에는 염기 서열이 연쇄적으로 반복하지 않아 STR 분석법에서 사용하기 힘든 구간도 존재하겠군.","상동 염색체의 동일한 위치에서 부계와 모계에서 받은 염색대 번호가 서로 다르겠군.","동일인에서 채취한 서로 다른 샘플에서는 같은 좌위라도 염기 서열의 반복 횟수가 다르겠군.","STR 분석법은 네 종류의 염기가 모두 반복되는 특정 구간을 분석 대상으로 하겠군.","국가 간에 공통적으로 사용하는 좌위가 없어 분석 결과를 공유하기 힘들겠군."],a:0,e:"② 염색대 번호는 같고 반복 횟수가 다를 수 있다. ③ 동일인이면 같다. ④ 네 종류 전부라는 근거는 없다. ⑤ 20개 표준 좌위가 있다."},
{t:"mc",q:"[기출 31] 보기: 범인 손톱의 DNA 프로필은 좌위①(5q33.1, AGAT) 5-3, 좌위②(13q31.1, TATC) 6-6, 좌위③(5q23.2, AGAT) 2-7, 좌위⑳(7q21.11, GATA) 8-4이다. 용의자 ‘을’의 모친도 분석을 의뢰했다. 적절하지 않은 것은?",o:["범인은 7번 염색체 하단부 특정 염색대에 ‘GATA’ 배열이 네 번 반복되는 DNA를 가지고 있군.","범인은 부계와 모계에서 받은 STR 반복 횟수가 동일하게 나오는 좌위를 하나 이상 가지고 있군.","‘을’의 DNA 프로필을 만들기 위해서는 ‘을’의 5번 염색체가 두 번 이상 분석에 활용되겠군.","‘을’이 범인이라면 ①과 ③에서 모계에서 받은 ‘AGAT’ 반복 횟수의 합이 12보다 클 수 없겠군.","‘을’의 분석 결과가 ②에서 ‘4-8’, ⑳에서 ‘8-4’로 나온다면 ⑳의 결괏값만으로도 ‘을’을 범인으로 확정할 수 있겠군."],a:4,e:"⑤ 20개 좌위가 모두 같아야 동일인일 확률이 100%에 가깝다. ②가 이미 다르므로 아니고, 한 좌위만으로 확정도 안 된다. ④ 모계분 최대는 ①에서 5, ③에서 7이니 합 12 이하다."},
{t:"mc",q:"[응용 1] 현장 샘플의 DNA 프로필은 좌위①~④에서 5-3, 6-6, 2-7, 8-4이다. 용의자 A는 5-3, 6-6, 2-7, 8-4이고 용의자 B는 5-3, 6-7, 2-7, 8-4이다. (그 외 좌위는 제시하지 않음) 가장 적절한 판단은?",o:["A는 동일인으로 확정된다.","B는 좌위②가 달라 동일인이 아니라고 볼 수 있다.","A와 B 모두 동일인이다.","B는 한 좌위만 달라서 동일인일 가능성이 높다.","결괏값이 다른 좌위가 있어도 동일인 여부는 알 수 없다."],a:1,e:"A는 제시된 좌위가 모두 같을 뿐 20개 전체를 비교한 것이 아니라 확정할 수 없다. 반대로 한 좌위라도 다르면 동일인이 아니다."},
{t:"mc",q:"[응용 2] 어떤 좌위에서 아버지의 결괏값이 4-6, 어머니의 결괏값이 5-7이다. 두 사람의 자녀에게 나올 수 없는 결괏값은? (순서는 무시)",o:["4-5","4-7","6-5","6-7","4-6"],a:4,e:"상동 염색체는 부계와 모계에서 하나씩 받는다. 4-6은 둘 다 아버지에게서 온 값이라 불가능하다."},
{t:"mc",q:"[응용 3] 어떤 좌위의 염기 서열이 아래와 같을 때 결괏값을 왼쪽부터 표시한 것은?\n왼쪽: …TCGATAGATAGATAGATATC…\n오른쪽: …TCGATAGATAGATAGATAGATAGATATC…",o:["6-4","4-6","3-5","8-12","2-3"],a:1,e:"반복 단위 GATA를 세면 왼쪽은 4번, 오른쪽은 6번이다. 왼쪽부터 표시하므로 4-6이다."},
{t:"mc",q:"[응용 4] 윗글을 바탕으로 한 추론으로 적절하지 않은 것은?",o:["좌위가 늘어나면 우연히 모든 좌위가 일치할 가능성이 더 줄어들겠군.","20개 중 일부만 일치하는 두 사람은 모두 일치하는 두 사람보다 동일인일 가능성이 낮겠군.","20개 모두 일치하더라도 동일인일 확률이 100%에 가깝다고만 표현하겠군.","20개 좌위가 모두 일치하면 동일인임이 100% 확정되겠군.","사람마다 반복 횟수가 다르다는 점이 STR 분석법의 판별 근거이겠군."],a:3,e:"지문은 ‘100%에 가깝다’고 했을 뿐 확정이라고 하지 않는다."},
{t:"mc",q:"[응용 5] 신원 불명 유해의 한 좌위 결과가 4-7이다. 친모로 추정되는 사람은 4-5, 친부로 추정되는 사람은 7-9이다. 가장 적절한 이해는?",o:["이 좌위만으로 친자 관계가 확정된다.","4는 모계에서, 7은 부계에서 받은 것으로 설명할 수 있어 이 좌위에서는 모순이 없다.","7은 모계에서 받은 값이다.","친부의 9가 유해에서도 나타나야 한다.","유해가 5-9로 나오면 같은 설명이 가능하다."],a:1,e:"유해의 두 값은 각각 부모에게서 하나씩이다. 4는 어머니(4-5), 7은 아버지(7-9)에게서 온 것이다. 한 좌위만으로는 확정할 수 없고, 5-9도 이론상 가능하지만 ‘4-7’ 결과와는 별개다."}
];

etc:[
{q:"전자요금징수시스템이 작동하는 과정을 차량이 첫 번째 게이트를 통과할 때부터 운전자에게 안내될 때까지 순서대로 서술하시오.",g:"작동 과정",pts:["차량 단말기와 제1기지국이 통신한다","제1기지국이 요금 징수 관련 데이터를 임시 저장소에 보관하면서 지역요금소 ETC 서버로 전송한다","ETC 서버가 분석한 뒤 도로공사 요금정산센터 서버에 징수할 요금 데이터를 찾도록 요청한다","찾은 데이터가 ETC 서버, 제2기지국을 거쳐 차량 단말기로 전송된다","수신되면 요금이 징수되고 결과가 안내표시기로 운전자에게 안내된다"],m:"차량이 첫 번째 게이트를 지나면 단말기와 제1기지국이 통신하고, 제1기지국은 요금 징수 관련 데이터를 임시 저장하면서 지역요금소 ETC 서버로 보낸다. ETC 서버는 분석 후 도로공사 요금정산센터 서버에 징수할 요금 데이터를 찾도록 요청한다. 찾은 데이터는 ETC 서버와 제2기지국을 거쳐 차량 단말기로 전송되고, 수신되면 요금이 징수되어 결과가 안내표시기로 운전자에게 안내된다."},
{q:"시분할 방식에서 ‘타임 슬롯’과 ‘프레임’의 개념을 각각 설명하고, 타임 슬롯이 데이터에 할당되는 기준을 쓰시오.",g:"시분할 개념",pts:["타임 슬롯은 동일한 크기로 분할된 시간의 단위이다","타임 슬롯은 차량이 진입하지 않아도 항상 만들어진다","프레임은 차량 한 대가 지나갈 때 데이터에 할당된 타임 슬롯들로 구성된 집합체이다","타임 슬롯은 규약으로 정해진 데이터 종류의 순서에 따라 할당된다"],m:"타임 슬롯은 동일한 크기로 분할된 시간의 단위로 차량이 없어도 항상 만들어진다. 차량이 지나가면 규약으로 정해진 데이터 종류의 순서에 따라 데이터에 타임 슬롯이 할당되고, 한 차량의 데이터에 할당된 타임 슬롯들의 집합체가 프레임이다."},
{q:"동기식 시분할 방식의 방식과 특징, 그리고 그에 따른 장점과 단점을 서술하시오.",g:"동기식·비동기식 비교",pts:["통신 규약에 따라 타임 슬롯을 데이터 종류 각각에 지정해 둔다","데이터가 전송되지 않으면 해당 타임 슬롯이 빈 채로 남는다","프레임에 포함된 타임 슬롯 개수가 모든 차량에서 동일하다","장점: 오류 발생 가능성이 낮다(정확성이 높다)","단점: 할당되지 않은 타임 슬롯이 있어 일부 낭비된다"],m:"동기식은 타임 슬롯을 데이터 종류마다 미리 지정해 두므로 데이터가 없으면 슬롯이 빈 채로 남고, 모든 차량의 프레임 슬롯 개수가 같다. 오류 발생 가능성이 낮은 대신 타임 슬롯이 일부 낭비된다."},
{q:"비동기식 시분할 방식의 방식과 특징, 주소 필드를 포함시키는 이유, 장점과 단점을 서술하시오.",g:"동기식·비동기식 비교",pts:["데이터가 없으면 슬롯을 비우지 않고 다음 순서의 데이터에 할당한다","프레임의 타임 슬롯 개수가 차량마다 다를 수 있다","슬롯이 해당 종류의 데이터에 정해져 있지 않으므로 종류를 확인하려고 주소 필드를 포함한다","장점: 타임 슬롯이 낭비되지 않는다(효율성이 높다)","단점: 오류 발생 가능성이 상대적으로 높다"],m:"비동기식은 데이터가 없으면 슬롯을 비우지 않고 다음 순서 데이터에 할당하므로 프레임의 슬롯 개수가 차량마다 다르다. 슬롯이 데이터 종류에 고정되지 않아 종류를 확인하도록 주소 필드를 포함한다. 슬롯 낭비는 없지만 오류 가능성이 상대적으로 높다."},
{q:"[보기 적용] 1번 차량(동기식)의 데이터는 I-1 유, I-2 무, I-3 유, I-4 유이고, 2번 차량(비동기식)은 I-1 유, I-2 유, I-3 유, I-4 무이다. 두 차량이 간격 없이 TS1부터 순서대로 지날 때 각 차량이 사용하는 타임 슬롯의 번호와 개수, 빈 슬롯을 쓰고 그 이유를 설명하시오.",g:"ETC 보기 적용",pts:["1번 차량은 TS1~TS4 네 개를 사용한다(동기식은 고정)","TS2는 I-2 데이터가 없어 빈 슬롯이다","2번 차량은 TS5~TS7 세 개만 사용한다","2번 차량은 I-4 데이터가 없어 TS8을 사용하지 않는다(비동기식은 있는 데이터에만 할당)"],m:"1번 차량(동기식)은 슬롯이 종류별로 고정되어 TS1~TS4 네 개를 쓰고, I-2가 없는 TS2는 빈 슬롯이다. 2번 차량(비동기식)은 데이터가 있는 I-1, I-2, I-3에만 TS5, TS6, TS7을 할당하므로 세 개만 쓰고 TS8은 쓰지 않는다."}

str:[
{q:"STR 분석법으로 동일인 여부를 확인하는 원리를 순서대로 서술하시오.",g:"STR 원리",pts:["STR은 짧은 염기 서열이 연쇄적으로 반복되는 부분이다","사람마다 반복되는 횟수가 다르다는 점에 착안한다","분석할 좌위를 특정하고 반복 횟수를 센다","여러 좌위의 결과를 샘플 간에 비교해 동일인인지 판단한다"],m:"STR은 짧은 염기 서열이 연쇄적으로 반복되는 부분으로, 반복 횟수가 사람마다 다르다. 분석할 좌위를 특정해 반복 횟수를 센 뒤, 여러 좌위의 결과를 샘플 간에 비교하여 동일인 여부를 판단한다."},
{q:"좌위 ‘4q31.3’의 의미와, 이 좌위에서 ‘CTTT’가 왼쪽 염색체에서 3번, 오른쪽 염색체에서 5번 반복될 때의 분석 결과 표기 및 이를 무엇이라 하는지 서술하시오.",g:"좌위·결괏값 읽기",pts:["4는 염색체 번호이다","q는 염색체 하단부이다","31.3은 염색대 번호이다","결과는 왼쪽부터 ‘3-5’로 표기한다","이처럼 STR을 분석한 결괏값을 DNA 프로필이라 한다"],m:"4q31.3에서 4는 염색체 번호, q는 하단부, 31.3은 염색대 번호이다. CTTT 반복이 왼쪽 3번, 오른쪽 5번이면 ‘3-5’로 표기하며, 이렇게 STR을 분석한 결괏값을 DNA 프로필이라 한다."},
{q:"상동 염색체가 무엇인지 설명하고, 한 좌위의 분석 결과가 ‘3-5’처럼 두 개의 값으로 나오는 이유를 서술하시오.",g:"상동 염색체·유전",pts:["상동 염색체는 모양과 크기가 동일한 염색체가 2개씩 쌍으로 존재하는 것이다","한 쌍은 부계와 모계에서 하나씩 물려받는다","한 좌위에는 쌍을 이루는 두 염색체가 각각 있어 값이 두 개 나온다"],m:"상동 염색체는 모양과 크기가 같은 염색체가 2개씩 쌍을 이룬 것으로, 부계와 모계에서 하나씩 물려받는다. 한 좌위에 두 염색체의 반복 횟수가 각각 나오므로 결과가 두 개의 값으로 표기된다."},
{q:"과학수사에서 20개의 좌위를 표준으로 사용하는 이유와, ‘20개 좌위가 모두 동일하면 동일인일 확률이 100%에 가깝다’는 말의 의미를 서술하시오.",g:"정확성·표준 좌위",pts:["여러 나라가 20개 좌위를 표준으로 동일하게 활용한다","좌위가 많을수록 우연히 모두 일치할 가능성이 낮아져 정밀해진다","20개가 모두 같아도 100% 확정이 아니라 ‘100%에 가깝다’는 뜻이다","한 좌위라도 다르면 동일인이 아니라고 볼 수 있다"],m:"여러 나라가 표준 20개 좌위를 동일하게 활용하므로 결과를 공유할 수 있고, 좌위가 많을수록 우연한 일치 가능성이 낮아져 더 정밀하다. 20개가 모두 같아도 동일인임이 확정되는 것이 아니라 확률이 100%에 가깝다는 뜻이며, 하나라도 다르면 동일인이 아니다."},
{q:"[보기 적용] 어떤 좌위에서 아버지의 결괏값은 4-6, 어머니의 결괏값은 5-7이다. 자녀에게 나올 수 있는 결괏값 두 가지와 나올 수 없는 결괏값 한 가지를 쓰고, 그 근거를 서술하시오. (순서는 무시)",g:"상동 염색체·유전",pts:["가능한 예(4-5, 4-7, 6-5, 6-7 중 두 가지)를 든다","불가능한 예(4-6 또는 5-7)를 든다","자녀는 부계와 모계에서 하나씩 물려받는다는 근거를 쓴다"],m:"가능한 값은 4-5, 4-7, 6-5, 6-7 등이고, 4-6이나 5-7은 불가능하다. 자녀는 상동 염색체를 부계와 모계에서 하나씩 받으므로 한 값은 아버지(4 또는 6), 다른 한 값은 어머니(5 또는 7)에게서 와야 한다."}

const TIPS={
'작동 과정':'단말기→제1기지국(임시 저장)→ETC 서버(분석)→정산센터(조회)→ETC 서버→제2기지국→단말기. 올라가는 것은 요금 징수 관련 데이터(제1기지국 경유), 내려오는 것은 징수할 요금 데이터(제2기지국 경유). 징수는 단말기가 수신할 때 이루어진다.',
'시분할 개념':'타임 슬롯=동일한 크기의 시간 단위(차량이 없어도 항상 생성), 프레임=한 차량 데이터에 할당된 슬롯들의 집합체. 슬롯은 규약으로 정해진 데이터 종류의 순서대로 할당된다. 슬롯과 프레임을 섞어 쓰지 않았는지 확인.',
'동기식·비동기식 비교':'동기식: 종류별 슬롯 고정, 빈 슬롯 가능, 프레임 슬롯 수 동일, 정확성↑ 효율↓(낭비). 비동기식: 있는 데이터에만 순서대로 할당, 슬롯 수 가변, 주소 필드 필요, 효율↑ 정확성↓(오류 가능성↑).',
'ETC 보기 적용':'동기식은 데이터가 없어도 항상 4칸(없는 칸은 빈 슬롯), 비동기식은 ‘유’인 데이터만 순서대로 칸을 센다. TS 번호를 직접 써 가며 차량별 칸을 나눠 보는 연습이 필요하다.',
'STR 원리':'STR=짧은 염기 서열의 연쇄 반복. 반복 횟수가 사람마다 다르다는 점에 착안. 순서: 좌위 찾기→반복 횟수 세기→여러 좌위 비교→동일인 판단. 분석 대상은 염기 30억 개 전체가 아니라 일부 좌위다.',
'상동 염색체·유전':'상동 염색체=모양·크기가 같은 쌍으로, 부계와 모계에서 하나씩 받는다. 한 좌위의 결괏값 두 개 중 하나는 부계, 하나는 모계. 자녀의 값은 아버지 한 값과 어머니 한 값의 조합이다.',
'좌위·결괏값 읽기':'4q31.3=염색체 4번, 하단부(q), 염색대 31.3. 결괏값은 왼쪽 염색체부터 반복 횟수를 표기(3-5). 반복 단위(CTTT 등)를 직접 하나씩 세는 연습이 필요하다.',
'정확성·표준 좌위':'20개 표준 좌위가 모두 같아야 동일인일 확률이 ‘100%에 가깝다’(확정은 아님). 하나라도 다르면 동일인이 아니다. 좌위가 늘수록 더 정밀하다. 국가 간에도 공통 좌위를 쓴다.',
'STR 보기 적용':'보기 문제는 표에서 좌위·결괏값·반복 서열을 정확히 짝지어 읽고, 선택지마다 ‘모두 일치’ 조건이나 부계·모계 규칙에 맞는지 대조한다.'};

function ach(n,o){const qs=isSoc(n)?socQ(n):o?[].concat(...PASS.map(p=>p.Q)):[1,2,3,4].reduce((a,u)=>a.concat(UNITQ[n+u]||[]),[]);return qs.length?Math.round(st(qs).c/qs.length*100):0}
function bk(n,c,o){const a=ach(n,o);return `<div class="card pc bk" style="border:1.5px solid ${SC[c]}" onclick="${o?'pick()':'subj(\''+n+'\')'}"><div class="gd" style="background:linear-gradient(to bottom,${SC[c]} 0,${SC[c]} 22%,transparent 100%)"></div><div class="tp"><img src="${COVER[n]}" alt=""><div class="nm">${n.split('|').join('<br>')}</div></div><div><div class="al"><span>성취도</span><b>${a}%</b></div><div class="bar"><i data-w="${a}" style="width:0;background:${SC[c]}"></i></div></div></div>`}
function animBars(){setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>{e.style.width=e.dataset.w+'%'}),90)}
const SUBJ=[[['독서와|작문','b',1],['영어','r'],['중국어|회화','t'],['일본어|회화','j']],[['정치','g'],['경제','g'],['동아시아|역사기행','g'],['현대사회와|윤리','g'],['한국지리|탐구','g']],[['세포와|물질대사','p'],['물질과|에너지','p'],['역학과|에너지','p'],['행성우주|과학','p']]];
const SECN=['언어 영역','사회 영역','과학 영역'];
const SC={b:'#8fb8ec',r:'#ee9a9a',t:'#93d3d8',j:'#c9b6ec',g:'#9bd3ae',p:'#f1a9c8'};
function subjects(){let h=`<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h2>과목 선택</h2><p class="tag"><b>${esc(NICK)}</b> 님</p></div>${OWNER&&DB?'<button class="b g s" style="width:auto;flex:none;padding:8px 14px" onclick="admin()">관리자</button>':''}</div><div class="qk"><button onclick="allStats()">전체 통계</button><button onclick="fbForm(1)">의견 남기기</button></div>`;
 SUBJ.forEach((row,ri)=>{h+=`<h3 class="sec">${SECN[ri]}</h3><div class="sg c2">`;row.forEach(([n,c,o])=>{if(COVER[n]){h+=bk(n,c,o);return}h+=`<div class="card pc" style="margin:0;padding:0;overflow:hidden;text-align:center;background:var(--bg);aspect-ratio:6/5;display:flex;flex-direction:column" onclick="${o?'pick()':'subj(\''+n+'\')'}"><div style="position:absolute;top:0;left:0;right:0;pointer-events:none;height:34px;background:linear-gradient(to bottom,${SC[c]} 0,${SC[c]} 18%,transparent 100%)"></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;font-weight:600;white-space:nowrap" class="sl">${n.split('|').join('<br>')}</div></div>`});h+='</div>'});
 show(h);animBars()}
let FBF=0;

 const done=r&&r.done,cur=done?r.v:draft;

 else if(q.t=='ox')[true,false].forEach(k=>{let c='opt';if(done){if(k==q.a)c+=' right';else if(k==r.v)c+=' wrong'}else if(cur===k)c+=' sel';h+=`<button class="${c}" ${done?'disabled':''} onclick="draft=${k};quiz()">${k?'O (맞다)':'X (틀리다)'}</button>`});

 let h=`<h2>관리자 통계</h2><p class="tag">참여자 ${ADM.length}명 · 나만 볼 수 있는 화면이에요.</p><div class="row" style="margin-bottom:6px"><button class="b" onclick="fbAdmin()">의견함 보기</button></div>`;
 if(!ADM.length)h+='<div class="card">아직 푼 사람이 없어요.</div>';
 ADM.forEach((r,i)=>{const all=[].concat(...PASS.map(p=>p.Q)),s=st(all,r.R||{});h+=`<div class="card pc" onclick="adminOne(${i})"><b>${esc(r.nick)}</b><div class="mut">${s.n}문제 풀이 · 정답률 ${s.r==null?'-':s.r+'%'} · 최근 ${fd(r.t)}</div><div class="bar"><i style="width:${s.r||0}%"></i></div></div>`});
 const qs=[].concat(...PASS.map(p=>p.Q)),ms=qs.map(q=>{let n=0,w=0;ADM.forEach(r=>{const x=(r.R||{})[q.id];if(x){n++;if(!x.ok)w++}});return{q,n,w}}).filter(x=>x.n&&x.w).sort((a,b)=>b.w/b.n-a.w/a.n||b.n-a.n).slice(0,8);
 if(ms.length){h+='<h3>많이 틀린 문제 (전체 참여자)</h3>';ms.forEach(x=>{h+=`<div class="card"><div class="tag">${P(x.q.id.replace(/\d+$/,'')).name} · ${x.q.g} · ${CATS.find(c=>c[0]==x.q.cat)[1]}</div><div style="white-space:pre-line">${esc(x.q.q.slice(0,90))}${x.q.q.length>90?'…':''}</div><div class="no-t">오답률 ${Math.round(x.w/x.n*100)}% <span class="mut">(${x.w}/${x.n}명)</span></div></div>`})}
 h+='<div class="row"><button class="b g" onclick="admin()">새로고침</button><button class="b g" onclick="subjects()">나가기</button></div>';show(h)}
function adminLogin(){show(`<div class="fbw"><h2>관리자 로그인</h2><p class="tag">Supabase에 만든 관리자 계정으로 로그인하세요.</p><div class="card"><input type="email" id="ae" placeholder="이메일" autocomplete="username"><div style="height:8px"></div><input type="password" id="ap" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key=='Enter')adminIn()"></div><div class="row"><button class="b g" onclick="home()">뒤로</button><button class="b" onclick="adminIn()">로그인</button></div></div>`)}
async function adminIn(){if(!DB)return soonMsg('서버에 연결되지 않았어요.');const e=document.getElementById('ae').value.trim(),p=document.getElementById('ap').value;
 try{const {error}=await DB.auth.signInWithPassword({email:e,password:p});if(error)throw error;OWNER=true;soonMsg('관리자로 로그인했어요.');NICK?admin():home()}catch(x){soonMsg('로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.')}}
function adminOne(i){const r=ADM[i],X=r.R||{};let h=`<h2>${esc(r.nick)}</h2><p class="tag">최근 활동 ${fd(r.t)}</p>`;
 PASS.forEach(p=>{const s=st(p.Q,X);h+=`<div class="card"><b>${p.name}</b><div class="mut">${stTxt(s)}</div><div class="bar"><i style="width:${s.r||0}%"></i></div>`;
  CATS.forEach(([k,l])=>{const t=st(p.Q.filter(q=>q.cat==k),X);h+=`<div class="mut">${l}: ${t.n?t.c+'/'+t.n+' ('+t.r+'%)':'안 풂'}</div>`});
  const tg={};p.Q.forEach(q=>{if(X[q.id]){const t=tg[q.g]=tg[q.g]||{n:0,c:0};t.n++;if(X[q.id].ok)t.c++}});
  const wk=Object.keys(tg).filter(k=>tg[k].c<tg[k].n).sort((a,b)=>tg[a].c/tg[a].n-tg[b].c/tg[b].n);
  h+=wk.length?`<div style="margin-top:8px"><b class="no-t">약점</b> ${wk.map(k=>k+' '+tg[k].c+'/'+tg[k].n).join(' · ')}</div>`:(st(p.Q,X).n?'<div class="ok-t" style="margin-top:8px">틀린 영역 없음</div>':'');
  const wq=p.Q.filter(q=>X[q.id]&&!X[q.id].ok);if(wq.length)h+=`<div class="mut" style="margin-top:6px">틀린 문제: ${wq.map(q=>q.id.replace(/\D+/,'')*1+1).map((n,k)=>(wq[k].t=='es'?'서술':'')+n+'번').join(', ')}</div>`;h+='</div>'});
 h+='<div class="row"><button class="b g" onclick="admin()">목록으로</button></div>';show(h)}
let ROUTING=false,REPL=false;
const encR=r=>r.split('/').map(encodeURIComponent).join('/');
function setR(r){if(ROUTING)return;const t=r?'#/'+encR(r):location.pathname+location.search;const cur=location.hash||'';const want=r?'#/'+encR(r):'';
 if(cur===want){REPL=false;return}
 try{if(REPL||(!r&&!cur))history.replaceState(null,'',t);else history.pushState(null,'',t)}catch(e){}REPL=false}
const curR=()=>{const h=location.hash||'';if(!h.startsWith('#/'))return '';try{return decodeURIComponent(h.slice(2))}catch(e){return ''}};
function findQ(id){for(const p of PASS)for(const q of p.Q)if(q.id==id)return q;for(const n in CUR)for(const U of CUR[n])for(const M of U.m)for(const q of M.q)if(q.id==id)return q;return null}
function saveSS(){try{if(SS)sessionStorage.setItem(KEY+'ss',JSON.stringify({pid:SS.pid,cat:SS.cat,meta:SS.meta,i:SS.i,resp:SS.resp,ids:SS.qs.map(q=>q.id)}))}catch(e){}}
function loadSS(){try{const o=JSON.parse(sessionStorage.getItem(KEY+'ss'));if(!o)return false;const qs=o.ids.map(findQ).filter(Boolean);if(!qs.length)return false;SS={pid:o.pid,cat:o.cat,meta:o.meta,i:Math.min(o.i,qs.length-1),resp:o.resp||{},qs};return true}catch(e){return false}}
function go2(r){
 const [k,...rest]=r.split('/'),v=rest.join('/');
 if(!r)return home();
 if(!NICK)return home();
 if(k=='subjects')return subjects();
 if(k=='pick')return pick();
 if(k=='menu'&&v)return menu(v);
 if(k=='subj'&&v&&SUBJ.flat().some(x=>x[0]==v))return subj(v);
 if(k=='stats')return allStats();
 if(k=='fb')return fbForm(+v||0);
 if(k=='admin'&&OWNER){if(v!==''&&ADM[+v])return adminOne(+v);return admin()}
 if(k=='fbadmin'&&OWNER)return fbAdmin();
 if((k=='quiz'||k=='result')&&(SS||loadSS()))return k=='quiz'?quiz():result();
 return subjects()}
function goR(r){ROUTING=true;try{go2(r)}finally{ROUTING=false}}
window.addEventListener('popstate',()=>{if(location.hash=='#admin')return;goR(curR())});
const H=(f,mk)=>function(...a){setR(mk(...a));return f.apply(this,a)};
home=H(home,()=>'');subjects=H(subjects,()=>'subjects');pick=H(pick,()=>'pick');menu=H(menu,id=>'menu/'+id);
subj=H(subj,n=>'subj/'+n);socPage=H(socPage,n=>'subj/'+n);allStats=H(allStats,()=>'stats');fbForm=H(fbForm,f=>'fb/'+(f||0));
admin=H(admin,()=>'admin');adminOne=H(adminOne,i=>'admin/'+i);fbAdmin=H(fbAdmin,()=>'fbadmin');
quiz=(f=>function(){setR('quiz');const x=f.apply(this,arguments);saveSS();return x})(quiz);
result=(f=>function(){REPL=true;setR('result');const x=f.apply(this,arguments);saveSS();return x})(result);
// 아이폰 홈 화면 앱: 왼쪽 가장자리에서 오른쪽으로 밀면 뒤로 가기
(function(){const sa=window.navigator.standalone===true;if(!sa)return;let sx=null,sy=0,dx=0;
 document.addEventListener('touchstart',e=>{const t=e.touches[0];if(t.clientX<26&&history.length>1){sx=t.clientX;sy=t.clientY;dx=0;A.style.transition='none'}else sx=null},{passive:true});
 document.addEventListener('touchmove',e=>{if(sx==null)return;const t=e.touches[0];dx=t.clientX-sx;if(Math.abs(t.clientY-sy)>Math.abs(dx)&&dx<30){sx=null;A.style.transform='';return}A.style.transform='translateX('+Math.max(0,dx*.6)+'px)'},{passive:true});
 document.addEventListener('touchend',()=>{if(sx==null)return;A.style.transition='transform .2s ease';A.style.transform='';if(dx>80)history.back();sx=null})})();
async function boot(){if(location.hash=='#admin'){chkAdmin();return home()}
 const lk=lastNick(),pn=ls('pin');
 if(!lk||!/^\d{4}$/.test(pn)){chkAdmin();return home()}
 NICK=lk;PIN=pn;try{R=JSON.parse(ls('rec:'+lk))||{}}catch(e){R={}}
 await chkAdmin();goR(curR());
 if(DB){try{const {data,error}=await DB.rpc('player_login',{p_nick:lk,p_pin:pn});if(!error&&data){
  if(data.status=='ok'||data.status=='new'){const loc=R;R=Object.assign({},data.data||{},loc);ls('rec:'+NICK,JSON.stringify(R));if(Object.keys(loc).length)sync()}
  else if(data.status=='wrong'){ls('last',null);ls('pin',null);NICK='';PIN='';REPL=true;home();soonMsg('비밀번호가 바뀌어 다시 입력해야 해요.')}}}catch(e){}}}

boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
