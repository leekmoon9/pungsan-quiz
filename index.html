<script>
const ETC=[{"t":"sh","q":"차량이 요금소의 첫 번째 게이트를 통과하면, 차량 단말기는 첫 번째 게이트에 설치된 [빈칸]과 통신한다.","a":["제1기지국","1기지국"],"m":"제1기지국","e":"첫 번째 게이트에 설치된 제1기지국과 통신이 일어난다."},{"t":"sh","q":"제1기지국은 차량 단말기에서 받은 요금 징수 관련 데이터를 [빈칸] 않도록 임시 저장소에 보관한다.","a":["잃어버리","잃지","분실"],"m":"잃어버리지","e":"데이터를 잃어버리지 않도록 임시 저장소에 보관하면서 거의 동시에 지역요금소 ETC 서버로 전송한다."},{"t":"mc","q":"전자요금징수시스템의 작동 과정을 순서대로 바르게 나열한 것은?","o":["차량 단말기→제1기지국→지역요금소 ETC 서버→도로공사 서버→지역요금소 ETC 서버→제2기지국→차량 단말기","차량 단말기→제2기지국→지역요금소 ETC 서버→도로공사 서버→제1기지국→차량 단말기","차량 단말기→제1기지국→도로공사 서버→지역요금소 ETC 서버→제2기지국→차량 단말기","제1기지국→차량 단말기→지역요금소 ETC 서버→제2기지국→도로공사 서버→차량 단말기"],"a":0,"e":"포스트잇 도식 그대로다. 요금 징수 관련 데이터는 제1기지국을 거쳐 올라가고, 징수할 요금에 관한 데이터는 제2기지국을 거쳐 내려온다."},{"t":"mc","q":"지역요금소 ETC 서버가 요금 징수 관련 데이터를 받은 뒤 하는 일로 알맞은 것은?","o":["데이터를 분석한 후 도로공사 서버로 전송해 징수할 요금 데이터를 찾도록 요청한다","데이터를 임시 저장소에 보관한다","차량 단말기에 요금을 직접 징수한다","안내표시기에 결과를 표시한다"],"a":0,"e":"분석 → 전송 → 요청. 임시 저장은 제1기지국의 역할이다."},{"t":"ox","q":"징수할 요금에 관한 데이터는 제1기지국을 경유하여 차량 단말기로 전송된다.","a":false,"e":"제2기지국을 경유한다. 제1기지국은 올라가는 데이터, 제2기지국은 내려오는 데이터 담당이다."},{"t":"sh","q":"징수할 요금에 관한 데이터가 [빈칸]에 수신되면, 그 단말기를 통해 요금이 징수된다.","a":["단말기"],"m":"차량 단말기","e":"데이터가 수신되면 차량 단말기를 통해 요금이 징수되고, 그 결과가 안내표시기로 운전자에게 안내된다."},{"t":"ox","q":"요금 징수 결과는 안내표시기를 통해 운전자에게 안내된다.","a":true,"e":"맞다. 과정의 마지막 단계다."},{"t":"sh","q":"차량 단말기와 기지국 간에는, 동일한 크기로 분할된 시간 단위를 데이터에 할당하는 [빈칸] 방식으로 데이터를 처리한다.","a":["시분할"],"m":"시분할","e":"동일한 크기로 분할된 시간 단위(타임 슬롯)를 데이터에 할당하여 처리하는 방식."},{"t":"sh","q":"타임 슬롯은 동일한 크기로 분할된 [빈칸]의 단위이다.","a":["시간"],"m":"시간","e":"타임 슬롯 자체가 시간의 단위이고, 그 집합체는 프레임이다."},{"t":"ox","q":"타임 슬롯은 차량이 진입해야만 만들어진다.","a":false,"e":"타임 슬롯은 차량이 진입하지 않아도 항상 만들어진다. 차량이 지나가면 그때 데이터에 할당된다."},{"t":"sh","q":"차량 한 대가 지나갈 때 데이터에 할당된 타임 슬롯들이 이루는 집합체를 [빈칸]이라고 한다.","a":["프레임"],"m":"프레임","e":"슬롯은 단위, 프레임은 집합체. 16번 ④ 함정이 여기서 나온다."},{"t":"mc","q":"타임 슬롯이 데이터에 할당될 때 기준이 되는 순서는?","o":["차량이 도착한 순서","규약으로 정해진 데이터 종류의 순서","데이터의 크기가 큰 순서","운전자가 설정한 순서"],"a":1,"e":"규약으로 정해진 데이터 종류의 순서에 따라 타임 슬롯이 할당된다."},{"t":"sh","q":"시분할 방식은 타임 슬롯 할당 방식과 프레임 구성 방식에 따라 동기식과 [빈칸]으로 나뉜다.","a":["비동기"],"m":"비동기식","e":"지문 3문단 마지막 문장."},{"t":"ox","q":"동기식 시분할 방식에서는 데이터가 전송되지 않으면 해당 타임 슬롯이 빈 채로 남는다.","a":true,"e":"종류별로 슬롯이 지정되어 있어 데이터가 없어도 다른 데이터가 쓸 수 없다."},{"t":"ox","q":"동기식 시분할 방식에서는 하나의 프레임에 포함된 타임 슬롯의 개수가 차량마다 다르다.","a":false,"e":"동기식은 모든 차량이 같고, 비동기식은 차량마다 다를 수 있다."},{"t":"ox","q":"비동기식 시분할 방식에서는 전송되는 데이터가 없으면 타임 슬롯을 비워 두고 다음 데이터를 기다린다.","a":false,"e":"비우지 않고 다음 순서에 해당하는 데이터에 타임 슬롯을 할당한다."},{"t":"sh","q":"비동기식은 타임 슬롯이 데이터 종류에 정해져 있지 않아서, 데이터의 종류를 확인할 수 있는 [빈칸]를 데이터마다 포함시킨다.","a":["주소"],"m":"주소 필드","e":"슬롯 위치로 종류를 알 수 없기 때문에 주소 필드가 필요하다."},{"t":"sh","q":"동기식 시분할 방식은 오류 가능성은 낮지만, 데이터에 할당되지 않은 타임 슬롯이 있어 타임 슬롯이 일부 [빈칸]된다.","a":["낭비"],"m":"낭비","e":"오류 가능성은 낮지만 데이터에 할당되지 않은 슬롯이 존재해 일부 낭비된다."},{"t":"sh","q":"비동기식 시분할 방식은 타임 슬롯이 낭비되지 않지만, 데이터 처리 과정에서 [빈칸] 발생 가능성이 상대적으로 높다.","a":["오류"],"m":"오류","e":"슬롯 낭비는 없지만 처리 과정에서 오류 발생 가능성이 높다."},{"t":"mc","q":"동기식과 비동기식을 비교한 것으로 옳은 것은?","o":["동기식: 정확성 높음, 효율성 낮음 / 비동기식: 정확성 낮음, 효율성 높음","동기식: 정확성 낮음, 효율성 높음 / 비동기식: 정확성 높음, 효율성 낮음","둘 다 정확성 높음, 효율성 같음","동기식이 정확성·효율성 모두 높음"],"a":0,"e":"필기 표 그대로. 동기식은 정확하지만 낭비, 비동기식은 효율적이지만 오류 가능성이 높다."},{"t":"ox","q":"최근 통신 기술의 발전과 교통 환경 변화로 새로운 장비가 도입되거나 통신 규약이 바뀌기도 한다.","a":true,"e":"마지막 문단. 시스템의 변화는 계속되고 있다."},{"t":"mc","q":"[기출 16] 윗글의 내용과 일치하지 않는 것은?","o":["전자요금징수시스템을 이용하면 요금 납부를 편리하게 할 수 있다.","차량 단말기와 기지국 간에는 데이터 전송이 무선으로 이루어진다.","시분할 방식에서 타임 슬롯은 차량이 진입하지 않아도 항상 만들어진다.","타임 슬롯은 동일한 크기로 분할된 시간의 단위들에 의해 구성된 집합체이다.","비동기식 시분할 방식은 전송되는 모든 데이터마다 주소 필드를 포함시켜 프레임이 구성된다."],"a":3,"e":"⟦4⟧ 집합체는 프레임이다. 타임 슬롯은 시간의 단위 하나다."},{"t":"mc","q":"[기출 17] [A]를 바탕으로 보기의 ㉮(차량 단말기), ㉯(제1기지국), ㉰(제2기지국), ㉱(지역요금소 ETC 서버), ㉲(도로공사 요금정산센터 서버)를 이해한 것으로 적절하지 않은 것은?","o":["㉮에서 ㉯로 요금 징수 관련 데이터가 전송된다.","㉯에서 ㉱로 요금 징수 관련 데이터가 전송된다.","㉰에서 ㉮로 징수할 요금에 관한 데이터가 전송된다.","㉱에서 ㉲로 요금 징수 관련 데이터가 전송되고, ㉱에서 ㉰로 징수할 요금에 관한 데이터가 전송된다.","㉲에서 ㉱로 징수할 요금에 관한 데이터가 전송되고, ㉲에서 ㉮로 요금 징수 관련 데이터가 전송된다."],"a":4,"e":"⟦5⟧ ㉲는 단말기로 직접 보내지 않는다. 징수할 요금 데이터는 ㉲→㉱→㉰→㉮ 순이다. (기호 라벨은 사진 기준 추정)"},{"t":"mc","q":"[기출 18] 보기: (Ⓐ)은 동기식이 상대적으로 높고 비동기식이 낮다. 데이터 처리 과정의 효율성은 동기식이 상대적으로 (Ⓑ), 비동기식이 (Ⓒ). Ⓐ~Ⓒ로 가장 적절한 것은?","o":["오류 발생 가능성 / 낮고 / 높다","오류 발생 가능성 / 높고 / 낮다","데이터 손실 가능성 / 높고 / 낮다","데이터 처리 과정의 정확성 / 낮고 / 높다","데이터 처리 과정의 정확성 / 높고 / 낮다"],"a":3,"e":"동기식이 높은 것은 정확성, 효율성은 동기식이 낮고 비동기식이 높다."},{"t":"mc","q":"[기출 19] 1번 차량(동기식)은 I-1 유, I-2 무, I-3 유, I-4 유. 2번 차량(비동기식)은 I-1 유, I-2 유, I-3 유, I-4 무. TS1부터 시작하고 두 차량 사이 슬롯은 없다. 적절하지 않은 반응은?","o":["TS2는 비워지는 슬롯으로, 1번 차량이 후불 카드를 사용하는 차량이 아니기 때문이겠군.","TS3과 TS7은 모두 차량 소유주와 카드 소지자가 일치하는지 확인할 수 있는 슬롯이겠군.","TS4에는 요금 감면 대상이라는 데이터가 있고, TS8에는 요금 감면 대상이 아니라는 데이터가 있겠군.","TS1로는 1번 차량의 정상 진입 여부를, TS7로는 2번 차량의 소유주·카드 소지자 일치 여부를 알 수 있겠군.","TS5에는 정상 진입 데이터가, TS6에는 후불 카드 사용 데이터가 담겨 있겠군."],"a":2,"e":"1번(동기식)은 TS1~4 고정 4개. 2번(비동기식)은 I-4가 없어 TS5~7 세 개뿐이다. 따라서 TS8은 2번 차량의 슬롯이 아니고, 요금 감면 대상이 아니라는 데이터도 전송되지 않는다."},{"t":"mc","q":"[응용 1] 하나의 차로를 1번(동기식), 2번(비동기식), 3번(비동기식) 차량이 간격 없이 순서대로 지나갔다. 데이터 유무는 아래와 같고 슬롯은 TS1부터 시작한다.\n1번: I-1 유, I-2 무, I-3 유, I-4 무\n2번: I-1 무, I-2 유, I-3 유, I-4 유\n3번: I-1 유, I-2 무, I-3 무, I-4 유\n적절하지 않은 것은?","o":["세 차량이 사용하는 타임 슬롯은 TS1~TS9로 모두 9개이다.","TS3에는 1번 차량의 I-3에 해당하는 데이터가 담긴다.","TS4는 1번 차량의 프레임에서 비어 있는 슬롯이다.","TS8에는 3번 차량의 I-1에 해당하는 데이터가 담긴다.","TS6에는 2번 차량의 I-2에 해당하는 데이터가 담긴다."],"a":4,"e":"1번(동기식)은 4개 고정이라 TS1~4(TS2, TS4가 빈 슬롯). 2번(비동기식)은 데이터가 있는 I-2, I-3, I-4만 차례로 TS5, 6, 7에 담긴다. 따라서 TS6은 I-3이다. 3번은 TS8(I-1), TS9(I-4)."},{"t":"mc","q":"[응용 2] 4종류의 데이터 중 2종류만 전송하는 차량 100대가 연속으로 지나갈 때, 두 방식을 비교한 것으로 가장 적절한 것은? (차량당 프레임 구성은 지문 기준, 방식별로 모든 차량이 동일하게 처리된다고 가정)","o":["동기식: 총 200슬롯, 낭비 0 / 비동기식: 총 200슬롯, 낭비 0","동기식: 총 400슬롯, 낭비 200 / 비동기식: 총 200슬롯, 낭비 0","동기식: 총 400슬롯, 낭비 0 / 비동기식: 총 400슬롯, 낭비 200","동기식: 총 400슬롯, 낭비 200 / 비동기식: 총 400슬롯, 낭비 100","동기식: 총 200슬롯, 낭비 200 / 비동기식: 총 100슬롯, 낭비 0"],"a":1,"e":"동기식은 차량마다 4슬롯 고정이라 100대면 400슬롯이고 그중 데이터가 없는 200슬롯이 낭비된다. 비동기식은 데이터가 있는 2종류에만 슬롯을 주므로 200슬롯이고 낭비가 없다. 대신 오류 가능성이 높다."},{"t":"mc","q":"[응용 3] 어떤 차량이 첫 번째 게이트를 정상 통과했으나 제2기지국이 고장 나 통신하지 못한다. 이때의 추론으로 가장 적절한 것은?","o":["제1기지국이 차량 단말기의 데이터를 받지 못한다.","도로공사 서버가 징수할 요금 데이터를 찾지 못한다.","요금 징수 관련 데이터는 ETC 서버까지 전송되지만, 징수할 요금 데이터가 단말기에 수신되지 못해 요금 징수와 결과 안내가 이루어지지 못한다.","요금은 정상 징수되지만 안내표시기 안내만 이루어지지 않는다.","제1기지국이 임시 저장소의 데이터를 삭제한다."],"a":2,"e":"제1기지국 단계와 정산센터 조회는 정상이다. 징수는 징수할 요금 데이터가 단말기에 수신되어야 이루어지고(제2기지국 경유), 안내는 그 후다."},{"t":"mc","q":"[응용 4] 데이터 종류가 I-1~I-4 네 가지일 때, 프레임에 대한 설명으로 가장 적절한 것은?","o":["동기식에서도 데이터가 없으면 프레임을 3개 슬롯으로 구성할 수 있다.","비동기식에서 프레임이 4개 슬롯이면 네 종류의 데이터가 모두 전송된 것이다.","비동기식 프레임은 모든 차량에서 항상 4개 슬롯이다.","동기식에서 I-2가 없으면 프레임은 3개 슬롯이 된다.","비동기식 프레임은 데이터 종류보다 많은 5개 슬롯이 될 수 있다."],"a":1,"e":"동기식은 항상 4개 고정이다(⟦1⟧, ⟦4⟧ 오답). 비동기식은 전송된 데이터 수만큼의 슬롯이므로 최대 4개이며(⟦3⟧, ⟦5⟧ 오답), 4개라면 모두 전송된 것이다."},{"t":"mc","q":"[응용 5] 요금소 운영 방식을 정하려는 상황에서 지문에 근거한 판단으로 가장 적절한 것은?","o":["오류 없는 처리가 최우선이면 비동기식을 택해야 한다. 슬롯이 낭비되지 않기 때문이다.","동기식은 모든 데이터에 주소 필드를 포함하므로 정확성이 높다.","효율성이 최우선이면 동기식을 택해야 하며, 이때 오류 가능성은 높아진다.","정확성을 중시하면 동기식을, 슬롯 낭비를 줄이려면 비동기식을 택할 수 있으나, 비동기식에서는 오류 가능성이 상대적으로 높은 점을 감수해야 한다.","두 방식은 정확성과 효율성이 동일해서 어느 쪽을 택해도 차이가 없다."],"a":3,"e":"동기식은 오류 가능성이 낮고(정확성 높음) 슬롯이 낭비되며, 비동기식은 슬롯 낭비가 없고(효율성 높음) 오류 가능성이 높다. 주소 필드는 비동기식의 특징이다."}];
const STR=[{"t":"sh","q":"STR(Short tandem repeat)은 우리말로 ‘짧은 연쇄 [빈칸]’이라는 뜻이다.","a":["반복"],"m":"반복","e":"DNA의 짧은 염기 서열이 연쇄적으로 반복되는 것을 뜻한다."},{"t":"sh","q":"STR 분석법은 DNA의 특정 구간에서 짧은 염기 서열이 [빈칸]으로 반복되어 나타나는 부분을 분석한다.","a":["연쇄"],"m":"연쇄적","e":"반복되는 횟수가 사람마다 다르다는 점을 이용한다."},{"t":"ox","q":"현재 DNA 분석에서 가장 많이 사용되는 방법은 STR 분석법이다.","a":true,"e":"1문단. STR 분석법이 가장 많이 사용된다."},{"t":"sh","q":"체세포의 핵에 모양과 크기가 동일한 염색체가 2개씩 쌍으로 존재할 때, 이 염색체들을 [빈칸]라고 한다.","a":["상동"],"m":"상동 염색체","e":"체세포의 핵에 쌍으로 존재한다. 서로 다른 모양이 아니라 동일한 모양과 크기다."},{"t":"sh","q":"상동 염색체 한 쌍은 [빈칸]와 모계에서 각각 하나씩 물려받는다.","a":["부계","아버지"],"m":"부계","e":"그래서 한 좌위에 부계에서 받은 값과 모계에서 받은 값, 두 개가 나온다."},{"t":"sh","q":"상동 염색체를 구성하는 가장 중요한 물질은 유전자를 포함하고 있는 [빈칸]이다.","a":["dna"],"m":"DNA","e":"염색체 구성 물질 중 가장 중요한 것이 DNA다."},{"t":"mc","q":"DNA를 구성하는 염기의 종류가 아닌 것은?","o":["아데닌(A)","구아닌(G)","우라실(U)","사이토신(C)","타이민(T)"],"a":2,"e":"A, G, C, T 네 종류다. 약 30억 개의 염기가 이어져 있다."},{"t":"sh","q":"DNA는 A, G, C, T 네 종류의 염기로 이루어지며, 이 염기들이 이어진 순서를 DNA의 [빈칸]이라고 한다.","a":["서열"],"m":"염기 서열","e":"예: ‘AGGCTA…’와 같은 형태로 이어져 있다."},{"t":"ox","q":"STR 분석법은 사람마다 염기 서열이 반복되는 횟수가 다르다는 점에 착안한 것이다.","a":true,"e":"ⓒ착안은 ‘어떤 생각이나 단서를 얻다’의 뜻이다."},{"t":"ox","q":"STR 분석법은 DNA의 염기 약 30억 개 전체를 분석 대상으로 한다.","a":false,"e":"염기 중 일부, 즉 STR이 있는 특정 좌위만 분석한다. (기출 29번 ⑤)"},{"t":"sh","q":"STR 분석을 하려면 먼저 분석하려는 염색체 내의 위치를 특정해야 하는데, 이 위치를 [빈칸]라고 한다.","a":["좌위"],"m":"좌위","e":"좌위가 정해져야 그 자리의 반복 횟수를 셀 수 있다."},{"t":"mc","q":"좌위 ‘4q31.3’에 대한 설명으로 옳지 않은 것은?","o":["4는 염색체 번호이다.","q는 염색체 하단부를 가리킨다.","31.3은 염색대 번호이다.","염색체 4번의 하단부에 있는 위치이다.","p는 염색체 하단부를 가리킨다."],"a":4,"e":"p는 상단부, q는 하단부다. (그림의 p, q 표시)"},{"t":"sh","q":"염색체를 염색할 때 생기는 띠 모양을 [빈칸]라고 한다.","a":["염색대"],"m":"염색대","e":"본문 각주. 좌위 번호 31.3은 이 띠의 번호다."},{"t":"mc","q":"그림의 4q31.3 좌위에서 ‘CTTT’가 왼쪽 염색체에서는 세 번, 오른쪽 염색체에서는 다섯 번 반복된다. 분석 결과를 왼쪽부터 표시한 것은?","o":["5-3","8","3-5","15","CTTT-3-5"],"a":2,"e":"왼쪽 3, 오른쪽 5이므로 ‘3-5’이다."},{"t":"ox","q":"‘갑’은 4번 염색체 하단부 31.3번 염색대 위치에 ‘CTTT’가 ‘3-5’인 유전형을 가진다.","a":true,"e":"염색체 번호(4), 하단부(q), 염색대(31.3), 반복 서열(CTTT), 결괏값(3-5)을 모두 읽어 낸 것이다."},{"t":"sh","q":"STR을 분석하여 ‘3-5’와 같은 결괏값으로 표기한 것을 [빈칸]이라고 한다.","a":["프로필"],"m":"DNA 프로필","e":"노트 포스트잇의 ‘분석 결과 2-3’ 옆에 적은 DNA 프로필이 바로 이것이다."},{"t":"ox","q":"우리나라를 비롯한 여러 나라에서는 20개의 좌위를 표준으로 하여 과학수사에 동일하게 활용하고 있다.","a":true,"e":"국가 간에 공통 좌위가 있다. (기출 30번 ⑤ 함정)"},{"t":"mc","q":"비교 샘플의 DNA 프로필이 20개 좌위에서 모두 동일할 때 지문의 설명으로 알맞은 것은?","o":["동일인일 확률이 정확히 100%이다.","동일인일 확률이 100%에 가깝다.","동일인일 확률이 50%이다.","20개 중 10개만 같아도 같은 결론이다.","동일인이 아닐 확률이 더 높다."],"a":1,"e":"‘100%에 가깝다’이지 100%가 아니다."},{"t":"ox","q":"좌위의 개수가 늘어날수록 더 정밀한 분석이 가능할 것이다.","a":true,"e":"마지막 문단. ⓔ정밀한은 ‘정교하고 치밀한’이다."},{"t":"sh","q":"STR 분석 순서: 좌위 찾기 → 염기 서열이 반복되는 [빈칸] 세기 → 여러 좌위 비교 → 동일인 여부 판단","a":["횟수"],"m":"횟수","e":"STR 분석법의 4단계 흐름이다."},{"t":"mc","q":"[기출 29] 윗글에 대한 이해로 가장 적절한 것은?","o":["사람마다 DNA를 구성하는 염기 종류가 다르다.","상동 염색체는 서로 다른 모양을 가진 한 쌍으로 존재한다.","STR 분석을 위해서는 먼저 염색체의 개수를 파악해야 한다.","20개의 표준 좌위에서는 염기 서열의 STR이 나타나지 않는다.","STR 분석법은 DNA에 있는 30억 개 염기 중 일부를 대상으로 한다."],"a":4,"e":"⟦1⟧ 염기 종류는 4가지로 같다. ⟦2⟧ 동일한 모양과 크기다. ⟦3⟧ 먼저 파악해야 하는 것은 좌위다. ⟦4⟧ 좌위에서 STR을 분석한다."},{"t":"mc","q":"[기출 30] 윗글을 읽고 추론한 내용으로 가장 적절한 것은?","o":["DNA에는 염기 서열이 연쇄적으로 반복하지 않아 STR 분석법에서 사용하기 힘든 구간도 존재하겠군.","상동 염색체의 동일한 위치에서 부계와 모계에서 받은 염색대 번호가 서로 다르겠군.","동일인에서 채취한 서로 다른 샘플에서는 같은 좌위라도 염기 서열의 반복 횟수가 다르겠군.","STR 분석법은 네 종류의 염기가 모두 반복되는 특정 구간을 분석 대상으로 하겠군.","국가 간에 공통적으로 사용하는 좌위가 없어 분석 결과를 공유하기 힘들겠군."],"a":0,"e":"⟦2⟧ 염색대 번호는 같고 반복 횟수가 다를 수 있다. ⟦3⟧ 동일인이면 같다. ⟦4⟧ 네 종류 전부라는 근거는 없다. ⟦5⟧ 20개 표준 좌위가 있다."},{"t":"mc","q":"[기출 31] 보기: 범인 손톱의 DNA 프로필은 좌위①(5q33.1, AGAT) 5-3, 좌위②(13q31.1, TATC) 6-6, 좌위③(5q23.2, AGAT) 2-7, 좌위⑳(7q21.11, GATA) 8-4이다. 용의자 ‘을’의 모친도 분석을 의뢰했다. 적절하지 않은 것은?","o":["범인은 7번 염색체 하단부 특정 염색대에 ‘GATA’ 배열이 네 번 반복되는 DNA를 가지고 있군.","범인은 부계와 모계에서 받은 STR 반복 횟수가 동일하게 나오는 좌위를 하나 이상 가지고 있군.","‘을’의 DNA 프로필을 만들기 위해서는 ‘을’의 5번 염색체가 두 번 이상 분석에 활용되겠군.","‘을’이 범인이라면 ①과 ③에서 모계에서 받은 ‘AGAT’ 반복 횟수의 합이 12보다 클 수 없겠군.","‘을’의 분석 결과가 ②에서 ‘4-8’, ⑳에서 ‘8-4’로 나온다면 ⑳의 결괏값만으로도 ‘을’을 범인으로 확정할 수 있겠군."],"a":4,"e":"⟦5⟧ 20개 좌위가 모두 같아야 동일인일 확률이 100%에 가깝다. 좌위 ②가 이미 다르므로 아니고, 한 좌위만으로 확정도 안 된다. ⟦4⟧ 모계분 최대는 좌위 ①에서 5, 좌위 ③에서 7이니 합 12 이하다."},{"t":"mc","q":"[응용 1] 현장 샘플의 DNA 프로필은 좌위①~④에서 5-3, 6-6, 2-7, 8-4이다. 용의자 A는 5-3, 6-6, 2-7, 8-4이고 용의자 B는 5-3, 6-7, 2-7, 8-4이다. (그 외 좌위는 제시하지 않음) 가장 적절한 판단은?","o":["A는 동일인으로 확정된다.","B는 좌위②가 달라 동일인이 아니라고 볼 수 있다.","A와 B 모두 동일인이다.","B는 한 좌위만 달라서 동일인일 가능성이 높다.","결괏값이 다른 좌위가 있어도 동일인 여부는 알 수 없다."],"a":1,"e":"A는 제시된 좌위가 모두 같을 뿐 20개 전체를 비교한 것이 아니라 확정할 수 없다. 반대로 한 좌위라도 다르면 동일인이 아니다."},{"t":"mc","q":"[응용 2] 어떤 좌위에서 아버지의 결괏값이 4-6, 어머니의 결괏값이 5-7이다. 두 사람의 자녀에게 나올 수 없는 결괏값은? (순서는 무시)","o":["4-5","4-7","6-5","6-7","4-6"],"a":4,"e":"상동 염색체는 부계와 모계에서 하나씩 받는다. 4-6은 둘 다 아버지에게서 온 값이라 불가능하다."},{"t":"mc","q":"[응용 3] 어떤 좌위의 염기 서열이 아래와 같을 때 결괏값을 왼쪽부터 표시한 것은?\n왼쪽: …TCGATAGATAGATAGATATC…\n오른쪽: …TCGATAGATAGATAGATAGATAGATATC…","o":["6-4","4-6","3-5","8-12","2-3"],"a":1,"e":"반복 단위 GATA를 세면 왼쪽은 4번, 오른쪽은 6번이다. 왼쪽부터 표시하므로 4-6이다."},{"t":"mc","q":"[응용 4] 윗글을 바탕으로 한 추론으로 적절하지 않은 것은?","o":["좌위가 늘어나면 우연히 모든 좌위가 일치할 가능성이 더 줄어들겠군.","20개 중 일부만 일치하는 두 사람은 모두 일치하는 두 사람보다 동일인일 가능성이 낮겠군.","20개 모두 일치하더라도 동일인일 확률이 100%에 가깝다고만 표현하겠군.","20개 좌위가 모두 일치하면 동일인임이 100% 확정되겠군.","사람마다 반복 횟수가 다르다는 점이 STR 분석법의 판별 근거이겠군."],"a":3,"e":"지문은 ‘100%에 가깝다’고 했을 뿐 확정이라고 하지 않는다."},{"t":"mc","q":"[응용 5] 신원 불명 유해의 한 좌위 결과가 4-7이다. 친모로 추정되는 사람은 4-5, 친부로 추정되는 사람은 7-9이다. 가장 적절한 이해는?","o":["이 좌위만으로 친자 관계가 확정된다.","4는 모계에서, 7은 부계에서 받은 것으로 설명할 수 있어 이 좌위에서는 모순이 없다.","7은 모계에서 받은 값이다.","친부의 9가 유해에서도 나타나야 한다.","유해가 5-9로 나오면 같은 설명이 가능하다."],"a":1,"e":"유해의 두 값은 각각 부모에게서 하나씩이다. 4는 어머니(4-5), 7은 아버지(7-9)에게서 온 것이다. 한 좌위만으로는 확정할 수 없고, 5-9도 이론상 가능하지만 ‘4-7’ 결과와는 별개다."}];

function ach(n,o){const qs=isSoc(n)?socQ(n):[];return qs.length?Math.round(st(qs).c/qs.length*100):0}

function bk(n,c,o){const a=ach(n,o),rd=hasC(n);return `<div class="card pc bk${rd?'':' bkx'}${sDone(n)?' cpl':''}" style="--sc:${SC[c]}" onclick="${rd||STAFF()?`subj('${n}')`:'soon()'}">${rd?'':'<span class="bkb">준비 중</span>'}<div class="tp"><img src="${COVER[n]}" alt=""><div class="nm">${n.split('|').join('<br>')}</div></div><div><div class="al"><span>${sDone(n)?'<span class="cplb">✓ 모두 완료</span>':'진행도'}</span><b>${a}%</b></div><div class="bar"><i data-w="${a}" style="width:0;background:${SC[c]}"></i></div></div></div>`}
function animBars(){setTimeout(()=>document.querySelectorAll('[data-w]').forEach(e=>{e.style.width=e.dataset.w+'%'}),90)}
const SUBJ=[[['독서와|작문','b',1],['영어','r'],['중국어|회화','t'],['일본어|회화','j']],[['미적분','y'],['기하','y']],[['정치','g'],['경제','g'],['동아시아|역사기행','g'],['현대사회와|윤리','g'],['한국지리|탐구','g']],[['세포와|물질대사','p'],['물질과|에너지','p'],['역학과|에너지','p'],['행성우주|과학','p']]];

function subjects(){let h=`<div class="hd" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><h2>학습하기</h2></div><span class="admw"><button class="b g s admb gdb2" onclick="guide()">사용법</button>${mailBtn()}<button class="pfb" aria-label="내 프로필" onclick="profile()">${PSVG}</button></span></div><div class="hd2"><p class="tag"><b>${esc(NICK)}</b> 님</p>${OWNER&&DB?'<span class="adm2"><button class="b g s admb rsb" onclick="myReset()">초기화</button><button class="b g s admb" onclick="admin()">관리자</button></span>':SUBMODE&&DB?'<span class="adm2"><button class="b g s admb" onclick="admin()">관리자</button></span>':''}</div><div class="qk">${isApp()?'<button onclick="allStats()">전체 통계</button>':`<button class="lkd" onclick="lockMsg()">${LOCK}전체 통계</button>`}<button onclick="fbForm(1)">피드백</button></div>`;
 SUBJ.forEach((row,ri)=>{h+=`<h3 class="sec">${SECN[ri]}</h3><div class="sg c2">`;row.forEach(([n,c,o])=>{if(COVER[n]){h+=bk(n,c,o);return}h+=`<div class="card pc" style="margin:0;padding:0;overflow:hidden;text-align:center;background:var(--bg);aspect-ratio:6/5;display:flex;flex-direction:column" onclick="subj('${n}')"><div style="position:absolute;top:0;left:0;right:0;pointer-events:none;height:34px;background:linear-gradient(to bottom,${SC[c]} 0,${SC[c]} 18%,transparent 100%)"></div><div style="flex:1;display:flex;align-items:center;justify-content:center;padding:4px;line-height:1.3;font-weight:600;white-space:nowrap" class="sl">${n.split('|').join('<br>')}</div></div>`});h+='</div>'});
 show(h);animBars();mailBadge();afterHome()}
let FBF=0;
function fbForm(f){FBF=f;show(`<div class="fbw"><h2>피드백</h2><p class="tag fbd">고쳐지면 메시지함으로 답장이 와요.</p><div class="card"><textarea id="fbt" maxlength="1000" placeholder="예) ETC 응용 2번 해설이 헷갈려요&#10;예) 영어도 빨리 열어 주세요" oninput="document.getElementById('fbs').disabled=!this.value.trim()"></textarea></div>${DB&&CANW!==false?'':'<p class="no-t" style="font-size:14px">서버에 연결되지 않았어요. 아래 버튼으로 내용을 복사해서 관리자에게 직접 보내 주세요.</p>'}<div class="row"><button class="b" id="fbs" disabled onclick="fbSend()">${DB&&CANW!==false?'보내기':'내용 복사하기'}</button></div></div>`)}
function soonMsg(m){const o=document.getElementById('toast');if(o)o.remove();const t=document.createElement('div');t.id='toast';t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1850)}
async function fbSend(){const t=document.getElementById('fbt').value.trim(),b=document.getElementById('fbs');if(!t)return;if(!DB||CANW===false){const ok=()=>soonMsg('복사했어요. 카톡으로 보내 주세요.');try{navigator.clipboard.writeText(t).then(ok,()=>{document.getElementById('fbt').select();soonMsg('길게 눌러서 복사해 주세요.')})}catch(e){document.getElementById('fbt').select();soonMsg('길게 눌러서 복사해 주세요.')}return}b.disabled=true;b.textContent='보내는 중…';
 try{const {error}=await DB.from('feedback').insert({nick:(NICK||lastNick()||'익명').slice(0,12),body:t});if(error)throw error;soonMsg('피드백이 전달됐어요. 고마워요!');FBF?subjects():home()}catch(e){b.disabled=false;b.textContent='보내기';soonMsg('보내지 못했어요. 다시 시도해 주세요.')}}

async function inbox(){const draw=()=>{if(CURR!='inbox')return;const L=MSGS||[],n=unread(),rd=L.filter(m=>m.read).length;
  let h=`<h2>메시지함</h2><p class="tag">${L.length?(n?`읽지 않은 메시지 ${n}개`:'모든 메시지를 읽었어요'):''}</p>`;

(()=>{const ed=t=>t&&t.closest&&t.closest('input,textarea,[contenteditable]');

 let t=0;const flash=ms=>{on();clearTimeout(t);t=setTimeout(()=>{if(document.hasFocus())off()},ms)};
 const wipe=()=>{try{navigator.clipboard&&navigator.clipboard.writeText('')}catch(e){}};
 window.addEventListener('blur',on);window.addEventListener('focus',()=>{clearTimeout(t);t=setTimeout(off,250)});

  if(k=='PrintScreen'||k=='Snapshot'){wipe();flash(1500);return}
  if(e.metaKey&&e.shiftKey){flash(2500);return}
  if((e.ctrlKey||e.metaKey)&&/^[psu]$/i.test(k)){e.preventDefault();return}
